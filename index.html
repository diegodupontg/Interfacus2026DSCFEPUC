<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesa de Control Inteligente - DSC</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Public Sans', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="text-slate-800">

    <div id="pantalla-login" class="min-h-screen flex items-center justify-center bg-slate-900 px-4" style="display: flex;">
        <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 space-y-6">
            <div class="text-center">
                <h1 class="text-3xl font-bold text-slate-900 tracking-tight">Mesa de Control</h1>
                <p class="text-slate-500 mt-2">Panel de Control DSC</p>
            </div>
            <form id="form-login" class="space-y-4" onsubmit="login(event)">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Correo Electrónico</label>
                    <input type="email" id="login-email" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none transition" placeholder="usuario@correo.com">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Contraseña</label>
                    <input type="password" id="login-password" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none transition" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-xl transition shadow-lg shadow-blue-500/20 cursor-pointer">
                    Ingresar al Sistema
                </button>
            </form>
            <div id="login-error" class="text-red-600 text-sm text-center font-medium hidden"></div>
        </div>
    </div>

    <div id="pantalla-app" class="min-h-screen hidden">
        <nav class="bg-slate-900 text-white px-6 py-4 shadow-md sticky top-0 z-50">
            <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
                <div class="flex items-center gap-3">
                    <div class="bg-blue-600 text-white font-black px-3 py-1.5 rounded-lg text-xl tracking-wider">DSC</div>
                    <div>
                        <h2 class="font-bold text-lg leading-tight">Panel Multi-Deporte</h2>
                        <p class="text-xs text-slate-400">Directorio de Encuentros</p>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <span id="txt-rol-usuario" class="bg-slate-800 px-4 py-2 rounded-xl text-sm font-medium border border-slate-700"></span>
                    <button onclick="logout()" class="bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white px-4 py-2 rounded-xl text-sm font-medium border border-red-500/30 transition cursor-pointer">
                        Cerrar Sesión
                    </button>
                </div>
            </div>
        </nav>

        <main class="max-w-7xl mx-auto px-4 py-8 space-y-8">
            <div id="seccion-crear-partido" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 hidden">
                <h3 class="text-lg font-bold text-slate-900 mb-4 flex items-center gap-2">
                    ➕ Registrar Encuentro DSC
                </h3>
                <form id="form-nuevo-partido" onsubmit="crearPartido(event)" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Deporte / Disciplina</label>
                        <select id="p-deporte" class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none text-sm cursor-pointer">
                            <option value="Básquetbol Varones">🏀 Básquetbol Varones</option>
                            <option value="Básquetbol Damas">🏀 Básquetbol Damas</option>
                            <option value="Fútsal Varones">⚽ Fútsal Varones</option>
                            <option value="Fútsal Damas">⚽ Fútsal Damas</option>
                            <option value="Fútbol Varones">⚽ Fútbol Varones</option>
                            <option value="Fútbol Damas">⚽ Fútbol Damas</option>
                            <option value="Vóleibol Damas">🏐 Vóleibol Damas</option>
                            <option value="Vóleibol Mixto">🏐 Vóleibol Mixto</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Fecha del Partido</label>
                        <input type="text" id="p-fecha" placeholder="Ej: SÁBADO 23 DE MAYO" required class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Hora Programada</label>
                        <input type="text" id="p-hora" placeholder="Ej: 14:30" required class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Facultad / Equipo Local</label>
                        <input type="text" id="p-local" placeholder="Ej: EEGGCC" required class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Facultad / Equipo Visitante</label>
                        <input type="text" id="p-visitante" placeholder="Ej: Letras" required class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Cancha / Ubicación</label>
                        <input type="text" id="p-cancha" placeholder="Ej: Cancha de Tejas / Coliseo" required class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none text-sm">
                    </div>
                    <div class="md:col-span-3 flex justify-end">
                        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-6 py-2.5 rounded-xl shadow transition text-sm cursor-pointer">
                            Publicar Encuentro
                        </button>
                    </div>
                </form>
            </div>

            <div id="navegador-fechas" class="bg-white p-3 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between">
                <button id="btn-fecha-ant" onclick="navegarFecha(-1)" class="bg-slate-100 hover:bg-slate-200 text-slate-600 px-4 py-2 rounded-xl font-bold transition disabled:opacity-50 disabled:cursor-not-allowed">◀ Anterior</button>
                <select id="selector-fecha" onchange="seleccionarFechaDirecta(this.value)" class="flex-1 mx-4 bg-transparent border-none text-center font-bold text-blue-800 text-lg outline-none focus:ring-0 cursor-pointer text-transform: uppercase">
                    <option>Cargando fechas...</option>
                </select>
                <button id="btn-fecha-sig" onclick="navegarFecha(1)" class="bg-slate-100 hover:bg-slate-200 text-slate-600 px-4 py-2 rounded-xl font-bold transition disabled:opacity-50 disabled:cursor-not-allowed">Siguiente ▶</button>
            </div>

            <div id="contenedor-partidos" class="grid grid-cols-1 gap-6"></div>
        </main>
    </div>

    <script>
        const SUPABASE_URL = 'https://jlynumhismotkwggjfug.supabase.co';
        const SUPABASE_KEY = 'sb_publishable__WfrjXpNunfcC9XGdP9h0w_3VGUcwXT';
        const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let esSuperAdmin = false;
        window.cronometrosActivos = {};

        let todosLosPartidos = [];
        let fechasUnicasOrdenadas = [];
        let indiceFechaSeleccionada = 0;

        function obtenerReglasDeporte(deporte) {
            const d = (deporte || "").toLowerCase();
            if (d.includes("básquet") || d.includes("basquet")) return { tiempoInicial: "10:00", modo: "countdown", usaReloj: true };
            if (d.includes("futsal") || d.includes("fútsal")) return { tiempoInicial: "20:00", modo: "countdown", usaReloj: true };
            if (d.includes("fútbol") || d.includes("futbol")) return { tiempoInicial: "00:00", modo: "countup", usaReloj: true };
            if (d.includes("vóley") || d.includes("voley") || d.includes("vóleibol")) return { tiempoInicial: "SET 1", modo: "texto", usaReloj: false };
            return { tiempoInicial: "00:00", modo: "countup", usaReloj: true };
        }

        _supabase.auth.onAuthStateChange(() => { verificarSesion(); });
        verificarSesion();

        async function verificarSesion() {
            const txtRol = document.getElementById("txt-rol-usuario");
            const seccionCrear = document.getElementById("seccion-crear-partido");
            try {
                const { data: { user } } = await _supabase.auth.getUser();
                if (user) {
                    document.getElementById("pantalla-login").style.display = "none";
                    document.getElementById("pantalla-app").style.display = "block";
                    
                    if (user.email === 'diegumdupont@gmail.com' || (user.app_metadata && user.app_metadata.role === 'superadmin')) {
                        esSuperAdmin = true;
                        txtRol.innerText = "🛡️ SUPERADMIN";
                        txtRol.className = "bg-red-50 text-red-700 px-4 py-2 rounded-xl text-sm font-bold border border-red-200 shadow-sm";
                        seccionCrear.classList.remove("hidden");
                    } else {
                        esSuperAdmin = false;
                        txtRol.innerText = `👤 Logger: ${user.email}`;
                        txtRol.className = "bg-slate-800 text-slate-300 px-4 py-2 rounded-xl text-sm font-medium border border-slate-700";
                        seccionCrear.classList.add("hidden");
                    }
                    cargarPartidosBase();
                } else {
                    document.getElementById("pantalla-login").style.display = "flex";
                    document.getElementById("pantalla-app").style.display = "none";
                }
            } catch (e) { console.error(e); }
        }

        async function login(e) {
            e.preventDefault();
            const email = document.getElementById("login-email").value;
            const password = document.getElementById("login-password").value;
            const errDiv = document.getElementById("login-error");
            const btnSubmit = e.target.querySelector('button[type="submit"]');
            
            errDiv.classList.add("hidden");
            btnSubmit.innerText = "Iniciando sesión...";
            btnSubmit.disabled = true;
            
            const { error } = await _supabase.auth.signInWithPassword({ email, password });
            
            if (error) { 
                errDiv.innerText = error.message; 
                errDiv.classList.remove("hidden"); 
                btnSubmit.innerText = "Ingresar al Sistema";
                btnSubmit.disabled = false;
            } else {
                await verificarSesion();
            }
        }

        async function logout() { 
            await _supabase.auth.signOut(); 
            window.location.reload(); 
        }

        async function cargarPartidosBase() {
            try {
                const { data: partidos, error } = await _supabase.from('partidos').select('*').order('id', { ascending: true });
                if (error) throw error;
                
                todosLosPartidos = partidos || [];
                
                const setFechas = new Set();
                todosLosPartidos.forEach(p => { if(p.fecha) setFechas.add(p.fecha); });
                fechasUnicasOrdenadas = Array.from(setFechas);

                const selector = document.getElementById("selector-fecha");
                selector.innerHTML = "";
                if(fechasUnicasOrdenadas.length === 0) {
                    selector.innerHTML = "<option>No hay fechas registradas</option>";
                    document.getElementById("contenedor-partidos").innerHTML = `<p class="text-slate-500 text-center py-12">No hay encuentros listados.</p>`;
                    return;
                }

                fechasUnicasOrdenadas.forEach((fecha, index) => {
                    const opcion = document.createElement("option");
                    opcion.value = index;
                    opcion.innerText = `📅 ${fecha.toUpperCase()}`;
                    selector.appendChild(opcion);
                });

                actualizarInterfazYPartidos();
            } catch (e) { console.error(e); }
        }

        function actualizarInterfazYPartidos() {
            const selector = document.getElementById("selector-fecha");
            const btnAnt = document.getElementById("btn-fecha-ant");
            const btnSig = document.getElementById("btn-fecha-sig");
            const contenedor = document.getElementById("contenedor-partidos");

            if (fechasUnicasOrdenadas.length === 0) return;

            selector.value = indiceFechaSeleccionada;
            btnAnt.disabled = (indiceFechaSeleccionada === 0);
            btnSig.disabled = (indiceFechaSeleccionada === fechasUnicasOrdenadas.length - 1);

            const fechaActual = fechasUnicasOrdenadas[indiceFechaSeleccionada];
            let partidosAMostrar = todosLosPartidos.filter(p => p.fecha === fechaActual);

            if (partidosAMostrar.length === 0) {
                contenedor.innerHTML = `<p class="text-slate-500 text-center py-12">No hay encuentros en esta fecha.</p>`;
                return;
            }

            let html = "";

            partidosAMostrar.forEach(p => {
                const reglas = obtenerReglasDeporte(p.deporte);
                const tiempoAMostrar = p.tiempo_actual || reglas.tiempoInicial;
                
                let badgeColor = "bg-slate-100 text-slate-700 border-slate-300";
                if (p.estado === "EN VIVO") badgeColor = "bg-red-50 text-red-700 border-red-200 animate-pulse";
                if (p.estado === "FINALIZADO") badgeColor = "bg-emerald-50 text-emerald-700 border-emerald-200";
                if (p.estado === "PAUSADO") badgeColor = "bg-amber-50 text-amber-700 border-amber-200";

                const estaCorriendo = !!window.cronometrosActivos[p.id];

                html += `
                <div class="bg-white rounded-2xl p-6 flex flex-col lg:flex-row justify-between items-start lg:items-center gap-6 shadow-sm border border-slate-200">
                    <div class="space-y-2 flex-1 w-full">
                        <div class="flex flex-wrap items-center gap-2">
                            <span class="px-2.5 py-1 text-xs font-semibold border rounded-lg ${badgeColor}">${p.estado || 'PENDIENTE'}</span>
                            <span class="text-xs font-bold text-blue-600 bg-blue-50 px-2 py-1 rounded-lg">${p.deporte}</span>
                            <span class="text-xs text-slate-500 font-medium">📍 ${p.cancha}</span>
                        </div>
                        <div class="text-xs font-bold text-slate-400 uppercase">${p.fecha} — ${p.hora_inicio}</div>
                        
                        <div class="flex flex-col sm:flex-row items-center gap-6 py-2">
                            <div class="flex items-center gap-4 justify-center">
                                <span class="font-bold text-slate-900 text-lg w-28 text-right truncate">${p.equipo_local}</span>
                                <div class="bg-slate-950 text-white font-mono text-2xl font-bold px-4 py-1.5 rounded-xl tracking-wider shadow-inner">
                                    ${p.puntos_local} : ${p.puntos_visitante}
                                </div>
                                <span class="font-bold text-slate-900 text-lg w-28 text-left truncate">${p.equipo_visitante}</span>
                            </div>

                            <div class="bg-slate-100 px-4 py-2 rounded-xl border border-slate-200 flex items-center gap-3 w-full sm:w-auto justify-between">
                                <div>
                                    <div class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Tiempo / Periodo</div>
                                    <div id="reloj-${p.id}" class="text-xl font-black font-mono text-slate-800 tracking-tight">${tiempoAMostrar}</div>
                                </div>
                                
                                <div class="flex gap-1">
                                    ${reglas.usaReloj && p.estado === "EN VIVO" ? `
                                        <button onclick="conmutarReloj('${p.id}', '${reglas.modo}')" class="px-3 py-1 rounded-lg font-bold text-xs shadow-sm transition active:scale-95 cursor-pointer ${estaCorriendo ? 'bg-amber-500 text-white hover:bg-amber-600' : 'bg-emerald-600 text-white hover:bg-emerald-700'}">
                                            ${estaCorriendo ? '⏸️ Pausar' : '▶️ Iniciar'}
                                        </button>
                                    ` : ''}
                                    <button onclick="editarTiempoManual('${p.id}', '${tiempoAMostrar}')" class="bg-white hover:bg-slate-200 text-slate-600 p-1 rounded-lg border border-slate-300 text-xs cursor-pointer">✏️</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="w-full lg:w-auto flex flex-col sm:flex-row lg:flex-col gap-3 border-t border-slate-100 lg:border-0 pt-4 lg:pt-0">
                        <div class="grid grid-cols-2 gap-2 flex-1">
                            <div class="flex items-center justify-center gap-1 bg-slate-50 p-1.5 rounded-xl border border-slate-200">
                                <button onclick="cambiarPuntos('${p.id}', 'puntos_local', -1)" class="w-8 h-8 rounded-lg bg-white border border-slate-300 font-bold text-sm cursor-pointer">-</button>
                                <span class="text-xs font-bold text-slate-500">Loc</span>
                                <button onclick="cambiarPuntos('${p.id}', 'puntos_local', 1)" class="w-8 h-8 rounded-lg bg-blue-600 text-white font-bold text-sm cursor-pointer">+</button>
                            </div>
                            <div class="flex items-center justify-center gap-1 bg-slate-50 p-1.5 rounded-xl border border-slate-200">
                                <button onclick="cambiarPuntos('${p.id}', 'puntos_visitante', -1)" class="w-8 h-8 rounded-lg bg-white border border-slate-300 font-bold text-sm cursor-pointer">-</button>
                                <span class="text-xs font-bold text-slate-500">Vis</span>
                                <button onclick="cambiarPuntos('${p.id}', 'puntos_visitante', 1)" class="w-8 h-8 rounded-lg bg-blue-600 text-white font-bold text-sm cursor-pointer">+</button>
                            </div>
                        </div>

                        <div class="flex gap-2 flex-1 items-center">
                            <select onchange="cambiarEstado('${p.id}', this.value)" class="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs font-semibold text-slate-700 cursor-pointer">
                                <option value="PENDIENTE" ${p.estado === 'PENDIENTE' ? 'selected' : ''}>⏳ Pendiente</option>
                                <option value="EN VIVO" ${p.estado === 'EN VIVO' ? 'selected' : ''}>🔴 En Vivo</option>
                                <option value="PAUSADO" ${p.estado === 'PAUSADO' ? 'selected' : ''}>⏸️ Pausado</option>
                                <option value="FINALIZADO" ${p.estado === 'FINALIZADO' ? 'selected' : ''}>🏁 Finalizado</option>
                            </select>
                            
                            <button onclick="window.location.href='panel.html?id=${p.id}'" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-3 py-2 rounded-xl text-xs shadow-sm border border-blue-500 transition cursor-pointer whitespace-nowrap">
                                📊 Loggear
                            </button>

                            ${esSuperAdmin ? `
                                <button onclick="eliminarPartido('${p.id}')" class="bg-red-50 text-red-600 p-2 rounded-xl border border-red-200 hover:bg-red-600 hover:text-white cursor-pointer" title="Eliminar partido">🗑️</button>
                            ` : ''}
                        </div>
                    </div>
                </div>`;
            });
            contenedor.innerHTML = html;
        }

        function navegarFecha(direccion) {
            indiceFechaSeleccionada += direccion;
            if (indiceFechaSeleccionada < 0) indiceFechaSeleccionada = 0;
            if (indiceFechaSeleccionada >= fechasUnicasOrdenadas.length) indiceFechaSeleccionada = fechasUnicasOrdenadas.length - 1;
            actualizarInterfazYPartidos();
        }

        function seleccionarFechaDirecta(valorIndex) {
            indiceFechaSeleccionada = parseInt(valorIndex);
            actualizarInterfazYPartidos();
        }

        // Se mantienen las funciones operativas de reloj y puntos en caso de necesitar operar desde el directorio
        async function conmutarReloj(id, modo) {
            if (window.cronometrosActivos[id]) {
                clearInterval(window.cronometrosActivos[id]);
                delete window.cronometrosActivos[id];
                const relojDom = document.getElementById(`reloj-${id}`);
                if(relojDom) {
                    await _supabase.from('partidos').update({ tiempo_actual: relojDom.innerText, estado: 'PAUSADO' }).eq('id', id);
                }
                cargarPartidosBase();
                return;
            }

            window.cronometrosActivos[id] = setInterval(async () => {
                const relojDom = document.getElementById(`reloj-${id}`);
                if (!relojDom) { 
                    clearInterval(window.cronometrosActivos[id]); 
                    delete window.cronometrosActivos[id];
                    return; 
                }

                let partes = relojDom.innerText.split(":");
                let minutos = parseInt(partes[0]) || 0;
                let segundos = parseInt(partes[1]) || 0;
                let totalSegundos = (minutos * 60) + segundos;

                if (modo === "countdown") {
                    totalSegundos--;
                    if (totalSegundos <= 0) {
                        clearInterval(window.cronometrosActivos[id]);
                        delete window.cronometrosActivos[id];
                        await _supabase.from('partidos').update({ tiempo_actual: "00:00", estado: 'PAUSADO' }).eq('id', id);
                        cargarPartidosBase();
                        return;
                    }
                } else {
                    totalSegundos++;
                }

                let nMin = Math.floor(totalSegundos / 60).toString().padStart(2, '0');
                let nSeg = (totalSegundos % 60).toString().padStart(2, '0');
                let nuevoTexto = `${nMin}:${nSeg}`;
                
                relojDom.innerText = nuevoTexto;

                if (totalSegundos % 5 === 0) {
                    await _supabase.from('partidos').update({ tiempo_actual: nuevoTexto }).eq('id', id);
                }
            }, 1000);

            const textoTiempoActual = document.getElementById(`reloj-${id}`).innerText;
            await _supabase.from('partidos').update({ tiempo_actual: textoTiempoActual, estado: 'EN VIVO' }).eq('id', id);
            cargarPartidosBase();
        }

        async function editarTiempoManual(id, valorActual) {
            const nuevoValor = prompt("Introduce el tiempo o periodo exacto (Ej: 08:30, SET 2):", valorActual);
            if (nuevoValor === null) return;
            try {
                await _supabase.from('partidos').update({ tiempo_actual: nuevoValor }).eq('id', id);
                cargarPartidosBase();
            } catch (e) { alert(e.message); }
        }

        async function cambiarPuntos(id, columna, cambio) {
            try {
                const { data: partido } = await _supabase.from('partidos').select(columna).eq('id', id).single();
                let nuevoValor = (partido[columna] || 0) + cambio;
                if (nuevoValor < 0) nuevoValor = 0;
                await _supabase.from('partidos').update({ [columna]: nuevoValor }).eq('id', id);
                cargarPartidosBase();
            } catch (e) { console.error(e); }
        }

        async function cambiarEstado(id, nuevoEstado) {
            try {
                if (nuevoEstado !== "EN VIVO" && window.cronometrosActivos[id]) {
                    clearInterval(window.cronometrosActivos[id]);
                    delete window.cronometrosActivos[id];
                }
                await _supabase.from('partidos').update({ estado: nuevoEstado }).eq('id', id);
                cargarPartidosBase();
            } catch (e) { console.error(e); }
        }

        async function crearPartido(e) {
            e.preventDefault();
            const deporte = document.getElementById("p-deporte").value;
            const reglas = obtenerReglasDeporte(deporte);

            try {
                const { error } = await _supabase.from('partidos').insert([{
                    deporte: deporte,
                    fecha: document.getElementById("p-fecha").value,
                    hora_inicio: document.getElementById("p-hora").value,
                    equipo_local: document.getElementById("p-local").value,
                    equipo_visitante: document.getElementById("p-visitante").value,
                    cancha: document.getElementById("p-cancha").value,
                    puntos_local: 0, puntos_visitante: 0, estado: 'PENDIENTE',
                    tiempo_actual: reglas.tiempoInicial
                }]);
                if (error) throw error;
                document.getElementById("form-nuevo-partido").reset();
                cargarPartidosBase();
                alert("¡Encuentro registrado exitosamente!");
            } catch (e) { alert(e.message); }
        }

        async function eliminarPartido(id) {
            if (!confirm("¿Eliminar este encuentro permanentemente?")) return;
            try {
                await _supabase.from('partidos').delete().eq('id', id);
                if (window.cronometrosActivos[id]) { clearInterval(window.cronometrosActivos[id]); delete window.cronometrosActivos[id]; }
                cargarPartidosBase();
            } catch (e) { console.error(e); }
        }
    </script>
</body>
</html>
