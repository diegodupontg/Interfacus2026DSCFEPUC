<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesa de Control Inteligente - DSC</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg-color: #121212; --card-color: #1e1e1e; --text-color: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 15px; text-align: center; }
        .container { max-width: 800px; margin: auto; background: var(--card-color); padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1 { color: #ffb703; margin: 0 0 5px 0; font-size: 1.6rem; }
        .match-info { font-size: 1.1rem; color: #aaa; margin-bottom: 15px; font-weight: bold; }
        
        /* SECCIÓN CRONÓMETRO */
        .timer-container { background: #000000; border: 3px solid #333; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
        .timer-display { font-family: 'Courier New', Courier, monospace; font-size: 4rem; font-weight: bold; color: #00ff00; margin-bottom: 5px; text-shadow: 0 0 10px rgba(0,255,0,0.5); cursor: pointer; }
        #periodo-display { color: #ffb703; font-size: 1.2rem; font-weight: bold; margin-bottom: 10px; text-transform: uppercase; }
        
        .timer-controls { display: flex; gap: 10px; justify-content: center; }
        .btn-timer { padding: 10px 20px; font-size: 1rem; font-weight: bold; border-radius: 5px; cursor: pointer; border: none; color: white; width: auto; min-width: 100px; }
        .btn-start { background: #2e7d32; }
        .btn-pause { background: #e65100; }
        .btn-reset { background: #424242; }

        .status-badge { background: #ffb703; color: black; padding: 5px 15px; border-radius: 20px; font-weight: bold; display: inline-block; margin-bottom: 15px; cursor: pointer; }
        .grid { display: flex; gap: 15px; justify-content: space-between; margin-top: 15px; }
        
        /* TARJETAS DE EQUIPO */
        .team-card { flex: 1; background: #2a2a2a; padding: 15px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.3); border-top: 5px solid #444; }
        .score-label { color: #888; font-size: 0.9rem; text-transform: uppercase; margin-top: 10px; letter-spacing: 1px; }
        .score { font-size: 4.5rem; font-weight: bold; margin: 5px 0 15px 0; line-height: 1; }
        
        .btn-group { display: flex; gap: 5px; margin-bottom: 5px; }
        button { flex: 1; padding: 12px; font-size: 1rem; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; color: white; text-shadow: 1px 1px 2px rgba(0,0,0,0.8); }
        
        .btn-sub { background: #424242; font-size: 0.9rem; padding: 8px; margin-bottom: 10px; width: 100%; text-shadow: none; }
        .btn-foul { background: #ef6c00; width: 100%; text-shadow: none; margin-bottom: 5px; }
        
        /* Modificadores condicionales */
        .btn-timeout, .btn-roja { width: 100%; text-shadow: none; margin-bottom: 5px; display: none; }
        .btn-timeout-sub, .btn-roja-sub { background: #424242; font-size: 0.8rem; padding: 4px; width: 100%; text-shadow: none; display: none; margin-bottom: 10px; }
        
        .btn-timeout { background: #1976d2; }
        .btn-roja { background: #d32f2f; }

        .btn-menu { background: #c62828; margin-top: 25px; padding: 15px 30px; font-size: 1.1rem; text-shadow: none; }
        
        footer { text-align: center; padding: 20px; margin-top: 20px; color: #aaa; font-size: 0.85rem; border-top: 1px solid #333; }
        
        /* Modal Estilos */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 10000; justify-content: center; align-items: center; overflow-y: auto; }
        .modal-content { background: white; padding: 30px; border-radius: 12px; width: 90%; max-width: 450px; color: black; text-align: left; box-shadow: 0 4px 20px rgba(0,0,0,0.5); margin-top: 50px; margin-bottom: 50px; }
        .modal-header { margin-top: 0; color: #b71c1c; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 0.85rem; font-weight: bold; color: #333; margin-bottom: 5px; }
        .input-group input, .input-group select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 1.1rem; }
        .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
        .btn-cancel { background: #e0e0e0; color: #333; text-shadow:none; padding: 10px 15px; width: auto; flex: none; }
        .btn-save { background: #2e7d32; color: white; text-shadow:none; padding: 10px 20px; width: auto; flex: none; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Mesa de Control - DSC</h1>
        <div id="match-title" class="match-info">Cargando datos del partido...</div>
        
        <div class="timer-container" id="box-cronometro">
            <div id="periodo-display">Cargando...</div>
            <div id="timer" class="timer-display" onclick="editarTiempoManual()" title="Haz clic para editar el tiempo manualmente">00:00</div>
            <div class="timer-controls">
                <button id="btn-cron-toggle" class="btn-timer btn-start" onclick="toggleCronometro()">INICIAR RELOJ</button>
                <button class="btn-timer btn-reset" onclick="avanzarPeriodo()">SIGUIENTE PERIODO</button>
            </div>
        </div>

        <div>
            <select id="match-status-select" class="status-badge" style="border: none; outline: none; cursor: pointer; text-align: center; text-transform: uppercase;" onchange="cambiarEstadoManual(this.value)">
                <option value="PENDIENTE">PENDIENTE</option>
                <option value="EN VIVO">EN VIVO</option>
                <option value="PAUSADO">PAUSADO</option>
                <option value="FINALIZADO">FINALIZADO</option>
            </select>
        </div>

        <div class="grid">
            <!-- LOCAL -->
            <div class="team-card" id="card-local">
                <h2 id="name-local" style="margin:0; font-size: 1.5rem;">Local</h2>
                <div class="score-label" id="label-score-local">PUNTOS</div>
                <div id="score-local" class="score">0</div>
                <div class="btn-group" id="botones-local"></div>
                <button class="btn-sub" onclick="modificarPuntos('local', -1)">-1 Deshacer</button>
                
                <button class="btn-foul" id="foul-local" onclick="modificarFaltas('local', 1)">+ Falta (0)</button>
                <button class="btn-sub" id="btn-sub-foul-local" onclick="modificarFaltas('local', -1)">-1 Falta</button>

                <button class="btn-roja" id="roja-local" onclick="modificarRojas('local', 1)">+ T. Roja (0)</button>
                <button class="btn-roja-sub" id="btn-sub-roja-local" onclick="modificarRojas('local', -1)">-1 Roja</button>

                <button class="btn-timeout" id="timeout-local" onclick="modificarTimeouts('local', 1)">+ Timeout (0)</button>
                <button class="btn-timeout-sub" id="btn-sub-timeout-local" onclick="modificarTimeouts('local', -1)">-1 Timeout</button>
            </div>

            <!-- VISITA -->
            <div class="team-card" id="card-visita">
                <h2 id="name-visita" style="margin:0; font-size: 1.5rem;">Visita</h2>
                <div class="score-label" id="label-score-visita">PUNTOS</div>
                <div id="score-visita" class="score">0</div>
                <div class="btn-group" id="botones-visita"></div>
                <button class="btn-sub" onclick="modificarPuntos('visita', -1)">-1 Deshacer</button>
                
                <button class="btn-foul" id="foul-visita" onclick="modificarFaltas('visita', 1)">+ Falta (0)</button>
                <button class="btn-sub" id="btn-sub-foul-visita" onclick="modificarFaltas('visita', -1)">-1 Falta</button>

                <button class="btn-roja" id="roja-visita" onclick="modificarRojas('visita', 1)">+ T. Roja (0)</button>
                <button class="btn-roja-sub" id="btn-sub-roja-visita" onclick="modificarRojas('visita', -1)">-1 Roja</button>

                <button class="btn-timeout" id="timeout-visita" onclick="modificarTimeouts('visita', 1)">+ Timeout (0)</button>
                <button class="btn-timeout-sub" id="btn-sub-timeout-visita" onclick="modificarTimeouts('visita', -1)">-1 Timeout</button>
            </div>
        </div>

        <div id="contenedor-boton-admin" style="margin-top: 20px;"></div>

        <button class="btn-menu" onclick="window.location.href='index.html'">Volver al Menú</button>
    </div>

    <footer>
        <p style="margin: 0 0 10px 0;">© 2026 Dupo Streaming Corporation</p>
        <span id="txt-rol-usuario" style="font-weight: bold;">👤 Verificando sesión...</span>
    </footer>

    <!-- MODAL SUPER ADMIN -->
    <div id="modal-superadmin" class="modal-overlay">
        <div class="modal-content">
            <h3 class="modal-header">⚙️ Corrección Maestra</h3>
            <p style="color: #555; font-size: 0.9rem; margin-bottom: 20px;">Sobrescribe los valores actuales del partido directamente en la base de datos.</p>
            
            <div style="display: flex; gap: 15px;">
                <div class="input-group" style="flex: 1;">
                    <label>Puntos Local</label>
                    <input type="number" id="admin-pts-local" min="0">
                </div>
                <div class="input-group" style="flex: 1;">
                    <label>Puntos Visita</label>
                    <input type="number" id="admin-pts-visita" min="0">
                </div>
            </div>

            <div style="display: flex; gap: 15px;">
                <div class="input-group" style="flex: 1;">
                    <label id="lbl-admin-flt">Faltas / Amarillas Local</label>
                    <input type="number" id="admin-flt-local" min="0">
                </div>
                <div class="input-group" style="flex: 1;">
                    <label id="lbl-admin-flt-v">Faltas / Amarillas Visita</label>
                    <input type="number" id="admin-flt-visita" min="0">
                </div>
            </div>

            <div style="display: flex; gap: 15px; display: none;" id="admin-rojas-container">
                <div class="input-group" style="flex: 1;">
                    <label>T. Rojas Local</label>
                    <input type="number" id="admin-rojas-local" min="0">
                </div>
                <div class="input-group" style="flex: 1;">
                    <label>T. Rojas Visita</label>
                    <input type="number" id="admin-rojas-visita" min="0">
                </div>
            </div>
            
            <div style="display: flex; gap: 15px; display: none;" id="admin-timeout-container">
                <div class="input-group" style="flex: 1;">
                    <label>Timeouts Local</label>
                    <input type="number" id="admin-to-local" min="0">
                </div>
                <div class="input-group" style="flex: 1;">
                    <label>Timeouts Visita</label>
                    <input type="number" id="admin-to-visita" min="0">
                </div>
            </div>

            <div class="modal-actions">
                <button class="btn-cancel" onclick="cerrarModalAdmin()">Cancelar</button>
                <button class="btn-save" onclick="guardarCorreccionManual()">Guardar Cambios</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://jlynumhismotkwggjfug.supabase.co';
        const SUPABASE_KEY = 'sb_publishable__WfrjXpNunfcC9XGdP9h0w_3VGUcwXT';
        const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const partidoId = new URLSearchParams(window.location.search).get('id');

        const coloresFacultades = {
            'Ciencias e Ingeniería': '#ffffff', 'Derecho': '#1a237e', 'Ciencias Sociales': '#d32f2f',
            'Gestión y Alta Dirección': '#ffeb3b', 'Arte y Diseño': '#7b1fa2', 'Estudios Generales Ciencias': '#388e3c',
            'Estudios Generales Letras': '#9e9e9e', 'Psicología': '#e91e63', 'Educación': '#03a9f4',
            'Ciencias Contables': '#0d47a1', 'Gastronomía y Hotelería': '#ff9800', 'Ciencias y Artes de la Comunicación': '#e64a19',
            'Arquitectura y Urbanismo': '#c0ca33', 'Artes Escénicas': '#ff5722', 'DEFAULT': '#555555'
        };

        const reglasDeportes = {
            'Futsal': { modoReloj: 'countdown', tiempoInicialTxt: '20:00', periodosText: ['1er Tiempo', '2do Tiempo'], txtPuntos: 'Goles', txtFaltas: 'Faltas', usaReloj: true, usaTimeouts: true, usaRojas: true, puntosBotones: [1] },
            'Fútbol': { modoReloj: 'countup', tiempoInicialTxt: '00:00', periodosText: ['1er Tiempo', '2do Tiempo'], txtPuntos: 'Goles', txtFaltas: 'T. Amarillas', usaReloj: true, usaTimeouts: false, usaRojas: true, puntosBotones: [1] },
            'Básquetbol': { modoReloj: 'countdown', tiempoInicialTxt: '10:00', periodosText: ['1er Cuarto', '2do Cuarto', '3er Cuarto', '4to Cuarto'], txtPuntos: 'Puntos', txtFaltas: 'Faltas', usaReloj: true, usaTimeouts: true, usaRojas: false, puntosBotones: [1, 2, 3] },
            'Voleibol': { modoReloj: 'texto', tiempoInicialTxt: 'SET 1', periodosText: ['1er Set', '2do Set', '3er Set', '4to Set', '5to Set'], txtPuntos: 'Puntos', txtFaltas: 'Sets Ganados', usaReloj: false, usaTimeouts: true, usaRojas: false, puntosBotones: [1] },
            'DEFAULT': { modoReloj: 'countup', tiempoInicialTxt: '00:00', periodosText: ['1er Periodo', '2do Periodo'], txtPuntos: 'Puntos', txtFaltas: 'Faltas', usaReloj: true, usaTimeouts: false, usaRojas: false, puntosBotones: [1] }
        };

        let esSuperAdmin = false;
        let reglasActuales = reglasDeportes['DEFAULT'];
        let colorLocal = '#ffffff', colorVisita = '#ffffff';
        let periodoActualIndex = 0;
        let estadoPartido = "PENDIENTE";
        let puntosLocal = 0, puntosVisita = 0, faltasLocal = 0, faltasVisita = 0, timeoutsLocal = 0, timeoutsVisita = 0, rojasLocal = 0, rojasVisita = 0;
        
        let intervaloCronometro = null;

        window.onload = async () => {
            const txtRol = document.getElementById("txt-rol-usuario");

            if (!partidoId) {
                document.getElementById('match-title').innerText = "⚠️ ERROR: No se detectó un partido válido.";
                document.getElementById('match-title').style.color = "#ff5252";
                txtRol.innerText = "Falta el ID del partido en la URL.";
                return; 
            }

            try {
                const { data: { user } } = await _supabase.auth.getUser();

                if (user) {
                    if (user.email === 'diegumdupont@gmail.com' || (user.app_metadata && user.app_metadata.role === 'superadmin')) {
                        esSuperAdmin = true;
                        txtRol.innerText = "🛡️ SESIÓN: SUPERADMIN ACTIVO";
                        txtRol.style.color = "#ff5252";
                        
                        document.getElementById('contenedor-boton-admin').innerHTML = `
                            <button onclick="abrirModalAdmin()" style="background: #b71c1c; color: white; width: 100%; padding: 15px; font-size: 1.1rem; border-radius: 8px; text-shadow: none; border: 2px solid #ffb703; cursor:pointer;">
                                ⚙️ ABRIR PANEL DE CORRECCIÓN
                            </button>
                        `;
                    } else {
                        esSuperAdmin = false;
                        txtRol.innerText = `👤 Logger: ${user.email}`;
                        txtRol.style.color = "#aaa";
                    }
                    cargarPartido();
                } else {
                    window.location.href = 'index.html';
                }
            } catch (error) {
                console.error("Error validando sesión:", error);
            }
        };

        async function cargarPartido() {
            try {
                const { data, error } = await _supabase.from('partidos').select('*').eq('id', partidoId).single();
                if (error) throw error;

                if (data) {
                    document.getElementById('match-title').innerText = data.deporte + " | " + data.cancha;
                    document.getElementById('name-local').innerText = data.equipo_local;
                    document.getElementById('name-visita').innerText = data.equipo_visitante;
                    
                    puntosLocal = data.puntos_local || 0;
                    puntosVisita = data.puntos_visitante || 0;
                    faltasLocal = data.faltas_local || 0;
                    faltasVisita = data.faltas_visitante || 0;
                    timeoutsLocal = data.timeouts_local || 0;
                    timeoutsVisita = data.timeouts_visitante || 0;
                    rojasLocal = data.rojas_local || 0;
                    rojasVisita = data.rojas_visitante || 0;
                    
                    estadoPartido = data.estado || "PENDIENTE";
                    
                    colorLocal = coloresFacultades[data.equipo_local] || coloresFacultades['DEFAULT'];
                    colorVisita = coloresFacultades[data.equipo_visitante] || coloresFacultades['DEFAULT'];
                    
                    document.getElementById('name-local').style.color = colorLocal;
                    document.getElementById('name-visita').style.color = colorVisita;
                    document.getElementById('card-local').style.borderTopColor = colorLocal;
                    document.getElementById('card-visita').style.borderTopColor = colorVisita;

                    let deporteClave = 'DEFAULT';
                    for (let key in reglasDeportes) {
                        if (data.deporte.includes(key)) deporteClave = key;
                    }
                    reglasActuales = reglasDeportes[deporteClave];
                    
                    aplicarReglasDeporte();
                    
                    document.getElementById('timer').innerText = data.tiempo_actual || reglasActuales.tiempoInicialTxt;
                    actualizarPantalla();
                    actualizarUIEstado();
                    
                    if(estadoPartido === 'EN VIVO' && reglasActuales.usaReloj) {
                        iniciarCronometroLocal();
                    }
                }
            } catch (err) {
                console.error("Error al cargar:", err);
            }
        }

        function aplicarReglasDeporte() {
            document.getElementById('label-score-local').innerText = reglasActuales.txtPuntos;
            document.getElementById('label-score-visita').innerText = reglasActuales.txtPuntos;
            document.getElementById('periodo-display').innerText = reglasActuales.periodosText[periodoActualIndex] || 'PERIODO EXTRA';
            
            if (!reglasActuales.usaReloj) {
                document.getElementById('timer').style.display = 'none';
                document.querySelector('.timer-controls').style.display = 'none';
                document.getElementById('box-cronometro').innerHTML = `
                    <div id="periodo-display" style="font-size: 2rem; margin-bottom: 10px; color:#ffb703; font-weight:bold;">${reglasActuales.periodosText[periodoActualIndex] || 'SET EXTRA'}</div>
                    <button class="btn-timer btn-start" style="width: 100%; background: #ffb703; color: black;" onclick="avanzarPeriodo()">PASAR AL SIGUIENTE SET</button>
                `;
            }

            if(reglasActuales.usaTimeouts) {
                document.querySelectorAll('.btn-timeout').forEach(el => el.style.display = 'block');
                document.querySelectorAll('.btn-timeout-sub').forEach(el => el.style.display = 'block');
            } else {
                document.querySelectorAll('.btn-timeout').forEach(el => el.style.display = 'none');
                document.querySelectorAll('.btn-timeout-sub').forEach(el => el.style.display = 'none');
            }

            if(reglasActuales.usaRojas) {
                document.querySelectorAll('.btn-roja').forEach(el => el.style.display = 'block');
                document.querySelectorAll('.btn-roja-sub').forEach(el => el.style.display = 'block');
            } else {
                document.querySelectorAll('.btn-roja').forEach(el => el.style.display = 'none');
                document.querySelectorAll('.btn-roja-sub').forEach(el => el.style.display = 'none');
            }

            let divLocal = document.getElementById('botones-local');
            let divVisita = document.getElementById('botones-visita');
            divLocal.innerHTML = ''; divVisita.innerHTML = '';

            reglasActuales.puntosBotones.forEach(pts => {
                let textBtn = reglasActuales.txtPuntos === 'Goles' ? '+1 Gol' : `+${pts}`;
                
                let btnL = document.createElement('button');
                btnL.innerText = textBtn; btnL.style.backgroundColor = colorLocal;
                if(['#ffffff', '#ffeb3b', '#c0ca33'].includes(colorLocal)) { btnL.style.color = 'black'; btnL.style.textShadow = 'none'; }
                btnL.onclick = () => modificarPuntos('local', pts);
                divLocal.appendChild(btnL);

                let btnV = document.createElement('button');
                btnV.innerText = textBtn; btnV.style.backgroundColor = colorVisita;
                if(['#ffffff', '#ffeb3b', '#c0ca33'].includes(colorVisita)) { btnV.style.color = 'black'; btnV.style.textShadow = 'none'; }
                btnV.onclick = () => modificarPuntos('visita', pts);
                divVisita.appendChild(btnV);
            });
        }

        async function toggleCronometro() {
            if (estadoPartido === 'EN VIVO') {
                detenerCronometroLocal();
                const tiempoText = document.getElementById('timer').innerText;
                await _supabase.from('partidos').update({ estado: 'PAUSADO', tiempo_actual: tiempoText }).eq('id', partidoId);
                estadoPartido = 'PAUSADO';
            } else {
                await _supabase.from('partidos').update({ estado: 'EN VIVO', tiempo_actual: document.getElementById('timer').innerText }).eq('id', partidoId);
                estadoPartido = 'EN VIVO';
                iniciarCronometroLocal();
            }
            actualizarUIEstado();
        }

        function iniciarCronometroLocal() {
            if (intervaloCronometro) clearInterval(intervaloCronometro);
            
            intervaloCronometro = setInterval(async () => {
                const relojDom = document.getElementById('timer');
                let partes = relojDom.innerText.split(":");
                let min = parseInt(partes[0]) || 0;
                let seg = parseInt(partes[1]) || 0;
                let totalSegundos = (min * 60) + seg;

                if (reglasActuales.modoReloj === "countdown") {
                    totalSegundos--;
                    if (totalSegundos <= 0) {
                        detenerCronometroLocal();
                        relojDom.innerText = "00:00";
                        await _supabase.from('partidos').update({ estado: 'PAUSADO', tiempo_actual: "00:00" }).eq('id', partidoId);
                        estadoPartido = 'PAUSADO';
                        actualizarUIEstado();
                        return;
                    }
                } else {
                    totalSegundos++;
                }

                let nMin = Math.floor(totalSegundos / 60).toString().padStart(2, '0');
                let nSeg = (totalSegundos % 60).toString().padStart(2, '0');
                relojDom.innerText = `${nMin}:${nSeg}`;

                if (totalSegundos % 5 === 0) {
                    _supabase.from('partidos').update({ tiempo_actual: `${nMin}:${nSeg}` }).eq('id', partidoId);
                }
            }, 1000);
        }

        function detenerCronometroLocal() {
            if (intervaloCronometro) {
                clearInterval(intervaloCronometro);
                intervaloCronometro = null;
            }
        }

        async function editarTiempoManual() {
            if(estadoPartido === 'EN VIVO') {
                alert("Debes pausar el reloj para editar el tiempo.");
                return;
            }
            
            const valorActual = document.getElementById('timer').innerText;
            const nuevoValor = prompt("Edición Manual del Tiempo (Formato MM:SS):", valorActual);
            
            if (nuevoValor && nuevoValor !== valorActual) {
                document.getElementById('timer').innerText = nuevoValor;
                await _supabase.from('partidos').update({ tiempo_actual: nuevoValor }).eq('id', partidoId);
            }
        }

        async function avanzarPeriodo() {
            detenerCronometroLocal();
            periodoActualIndex++;
            let textoPeriodo = reglasActuales.periodosText[periodoActualIndex] || 'PERIODO EXTRA';
            
            document.getElementById('periodo-display').innerText = textoPeriodo;
            
            if (reglasActuales.usaReloj) {
                document.getElementById('timer').innerText = reglasActuales.tiempoInicialTxt;
                estadoPartido = 'PAUSADO';
                await _supabase.from('partidos').update({ estado: 'PAUSADO', tiempo_actual: reglasActuales.tiempoInicialTxt }).eq('id', partidoId);
            } else {
                puntosLocal = 0; puntosVisita = 0;
                actualizarPantalla();
            }
            actualizarUIEstado();
        }

        async function cambiarEstadoManual(nuevoEstado) {
            if(nuevoEstado !== 'EN VIVO') detenerCronometroLocal();
            
            estadoPartido = nuevoEstado;
            const tiempoText = document.getElementById('timer') ? document.getElementById('timer').innerText : "SET";
            
            await _supabase.from('partidos').update({ estado: nuevoEstado, tiempo_actual: tiempoText }).eq('id', partidoId);
            
            if(nuevoEstado === 'EN VIVO' && reglasActuales.usaReloj) iniciarCronometroLocal();
            
            actualizarUIEstado();
        }

        function actualizarUIEstado() {
            const select = document.getElementById('match-status-select');
            const btnReloj = document.getElementById('btn-cron-toggle');
            
            select.value = estadoPartido;
            
            if (estadoPartido === 'EN VIVO') {
                select.style.background = "#2e7d32"; select.style.color = "white";
                if(btnReloj) { btnReloj.innerText = "PAUSAR RELOJ"; btnReloj.className = "btn-timer btn-pause"; }
            } else if (estadoPartido === 'PAUSADO' || estadoPartido === 'PENDIENTE') {
                select.style.background = "#ffb703"; select.style.color = "black";
                if(btnReloj) { btnReloj.innerText = "INICIAR RELOJ"; btnReloj.className = "btn-timer btn-start"; }
            } else {
                select.style.background = "#6a1b9a"; select.style.color = "white";
                if(btnReloj) { btnReloj.innerText = "FINALIZADO"; btnReloj.className = "btn-timer btn-reset"; }
            }
        }

        function actualizarPantalla() {
            document.getElementById('score-local').innerText = puntosLocal;
            document.getElementById('score-visita').innerText = puntosVisita;
            
            document.getElementById('foul-local').innerText = `+ ${reglasActuales.txtFaltas} (${faltasLocal})`;
            document.getElementById('foul-visita').innerText = `+ ${reglasActuales.txtFaltas} (${faltasVisita})`;

            document.getElementById('roja-local').innerText = `+ T. Roja (${rojasLocal})`;
            document.getElementById('roja-visita').innerText = `+ T. Roja (${rojasVisita})`;
            
            document.getElementById('timeout-local').innerText = `+ Timeout (${timeoutsLocal})`;
            document.getElementById('timeout-visita').innerText = `+ Timeout (${timeoutsVisita})`;
        }

        async function modificarPuntos(equipo, cant) {
            if (equipo === 'local') puntosLocal = Math.max(0, puntosLocal + cant);
            else puntosVisita = Math.max(0, puntosVisita + cant);
            actualizarPantalla();
            await _supabase.from('partidos').update({ puntos_local: puntosLocal, puntos_visitante: puntosVisita }).eq('id', partidoId);
        }

        async function modificarFaltas(equipo, cant) {
            if (equipo === 'local') faltasLocal = Math.max(0, faltasLocal + cant);
            else faltasVisita = Math.max(0, faltasVisita + cant);
            actualizarPantalla();
            await _supabase.from('partidos').update({ faltas_local: faltasLocal, faltas_visitante: faltasVisita }).eq('id', partidoId);
        }

        async function modificarRojas(equipo, cant) {
            if (equipo === 'local') rojasLocal = Math.max(0, rojasLocal + cant);
            else rojasVisita = Math.max(0, rojasVisita + cant);
            actualizarPantalla();
            await _supabase.from('partidos').update({ rojas_local: rojasLocal, rojas_visitante: rojasVisita }).eq('id', partidoId);
        }

        async function modificarTimeouts(equipo, cant) {
            if (equipo === 'local') timeoutsLocal = Math.max(0, timeoutsLocal + cant);
            else timeoutsVisita = Math.max(0, timeoutsVisita + cant);
            actualizarPantalla();
            await _supabase.from('partidos').update({ timeouts_local: timeoutsLocal, timeouts_visitante: timeoutsVisita }).eq('id', partidoId);
        }

        function abrirModalAdmin() {
            document.getElementById('admin-pts-local').value = puntosLocal;
            document.getElementById('admin-pts-visita').value = puntosVisita;
            document.getElementById('admin-flt-local').value = faltasLocal;
            document.getElementById('admin-flt-visita').value = faltasVisita;
            
            if(reglasActuales.usaTimeouts) {
                document.getElementById('admin-timeout-container').style.display = 'flex';
                document.getElementById('admin-to-local').value = timeoutsLocal;
                document.getElementById('admin-to-visita').value = timeoutsVisita;
            } else {
                document.getElementById('admin-timeout-container').style.display = 'none';
            }

            if(reglasActuales.usaRojas) {
                document.getElementById('admin-rojas-container').style.display = 'flex';
                document.getElementById('admin-rojas-local').value = rojasLocal;
                document.getElementById('admin-rojas-visita').value = rojasVisita;
            } else {
                document.getElementById('admin-rojas-container').style.display = 'none';
            }
            
            document.getElementById('modal-superadmin').style.display = 'flex';
        }

        function cerrarModalAdmin() { document.getElementById('modal-superadmin').style.display = 'none'; }

        async function guardarCorreccionManual() {
            puntosLocal = parseInt(document.getElementById('admin-pts-local').value) || 0;
            puntosVisita = parseInt(document.getElementById('admin-pts-visita').value) || 0;
            faltasLocal = parseInt(document.getElementById('admin-flt-local').value) || 0;
            faltasVisita = parseInt(document.getElementById('admin-flt-visita').value) || 0;
            
            if(reglasActuales.usaTimeouts) {
                timeoutsLocal = parseInt(document.getElementById('admin-to-local').value) || 0;
                timeoutsVisita = parseInt(document.getElementById('admin-to-visita').value) || 0;
            }

            if(reglasActuales.usaRojas) {
                rojasLocal = parseInt(document.getElementById('admin-rojas-local').value) || 0;
                rojasVisita = parseInt(document.getElementById('admin-rojas-visita').value) || 0;
            }

            actualizarPantalla();

            try {
                const { error } = await _supabase.from('partidos').update({
                    puntos_local: puntosLocal,
                    puntos_visitante: puntosVisita,
                    faltas_local: faltasLocal,
                    faltas_visitante: faltasVisita,
                    timeouts_local: timeoutsLocal,
                    timeouts_visitante: timeoutsVisita,
                    rojas_local: rojasLocal,
                    rojas_visitante: rojasVisita
                }).eq('id', partidoId);

                if (error) throw error;
                
                cerrarModalAdmin();
                alert("Valores sobrescritos correctamente.");
            } catch (error) { alert("Error: " + error.message); }
        }
    </script>
</body>
</html>
