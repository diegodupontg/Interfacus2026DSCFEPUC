<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesa de Control Inteligente - DSC</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg-color: #121212; --card-color: #1e1e1e; --text-color: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 15px; text-align: center; }
        .container { max-width: 800px; margin: auto; background: var(--card-color); padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1 { color: #ffb703; margin: 0 0 5px 0; font-size: 1.6rem; }
        .match-info { font-size: 1.1rem; color: #aaa; margin-bottom: 15px; font-weight: bold; }
        
        /* SECCIÓN CRONÓMETRO */
        .timer-container { background: #000000; border: 3px solid #333; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
        .timer-display { font-family: 'Courier New', Courier, monospace; font-size: 4rem; font-weight: bold; color: #00ff00; margin-bottom: 5px; text-shadow: 0 0 10px rgba(0,255,0,0.5); cursor: pointe[...]
        #periodo-display { color: #ffb703; font-size: 1.2rem; font-weight: bold; margin-bottom: 10px; text-transform: uppercase; }
        
        .timer-controls { display: flex; gap: 10px; justify-content: center; }
        .btn-timer { padding: 10px 20px; font-size: 1rem; font-weight: bold; border-radius: 5px; cursor: pointer; border: none; color: white; width: auto; min-width: 100px; }
        .btn-start { background: #2e7d32; }
        .btn-pause { background: #e65100; }
        .btn-reset { background: #424242; }

        .status-badge { background: #ffb703; color: black; padding: 5px 15px; border-radius: 20px; font-weight: bold; display: inline-block; margin-bottom: 15px; cursor: pointer; }
        .grid { display: flex; gap: 15px; justify-content: space-between; margin-top: 15px; }
        
        /* TARJETAS DE EQUIPO */
        .team-card { flex: 1; background: #2a2a2a; padding: 15px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.3); border-top: 5px solid #444; }
        .score-label { color: #888; font-size: 0.9rem; text-transform: uppercase; margin-top: 10px; letter-spacing: 1px; }
        .score { font-size: 4.5rem; font-weight: bold; margin: 5px 0 15px 0; line-height: 1; }
        
        .btn-group { display: flex; gap: 5px; margin-bottom: 5px; }
        button { flex: 1; padding: 12px; font-size: 1rem; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; color: white; text-shadow: 1px 1px 2px rgba(0,0,0,0.8); }
        
        .btn-sub { background: #424242; font-size: 0.9rem; padding: 8px; margin-bottom: 10px; width: 100%; text-shadow: none; }
        .btn-foul { background: #ef6c00; width: 100%; text-shadow: none; margin-bottom: 5px; }
        
        .btn-timeout, .btn-roja { width: 100%; text-shadow: none; margin-bottom: 5px; display: none; }
        .btn-timeout-sub, .btn-roja-sub { background: #424242; font-size: 0.8rem; padding: 4px; width: 100%; text-shadow: none; display: none; margin-bottom: 10px; }
        
        .btn-timeout { background: #1976d2; }
        .btn-roja { background: #d32f2f; }
        .btn-menu { background: #c62828; margin-top: 25px; padding: 15px 30px; font-size: 1.1rem; text-shadow: none; }
        
        footer { text-align: center; padding: 20px; margin-top: 20px; color: #aaa; font-size: 0.85rem; border-top: 1px solid #333; }
        
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 10000; justify-content: center; align-items: center; overflow[...]
        .modal-content { background: white; padding: 30px; border-radius: 12px; width: 90%; max-width: 450px; color: black; text-align: left; box-shadow: 0 4px 20px rgba(0,0,0,0.5); margin-top: 20px; [...]
        .modal-header { margin-top: 0; color: #b71c1c; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 0.85rem; font-weight: bold; color: #333; margin-bottom: 5px; }
        .input-group input, .input-group select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 1.1rem; }
        .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
        .btn-cancel { background: #e0e0e0; color: #333; text-shadow:none; padding: 10px 15px; width: auto; flex: none; }
        .btn-save { background: #2e7d32; color: white; text-shadow:none; padding: 10px 20px; width: auto; flex: none; }
    </style>
</head>
<body>
<!-- Contenido igual al anterior -->

<script>
// ... Todas las funciones anteriores ...

// ACTUALIZA aplicarReglasDeporte para que el cronómetro desaparezca en vóley y los puntos sean libres
function aplicarReglasDeporte() {
    document.getElementById('label-score-local').innerText = reglasActuales.txtPuntos;
    document.getElementById('label-score-visita').innerText = reglasActuales.txtPuntos;
    actualizarTextoPeriodo();

    // Oculta el cronómetro si no se usa (voley)
    if (!reglasActuales.usaReloj) {
        document.getElementById('box-cronometro').style.display = 'none';
    } else {
        document.getElementById('box-cronometro').style.display = 'block';
    }

    if (reglasActuales.usaTimeouts) {
        document.querySelectorAll('.btn-timeout').forEach(el => el.style.display = 'block');
        document.querySelectorAll('.btn-timeout-sub').forEach(el => el.style.display = 'block');
    } else {
        document.querySelectorAll('.btn-timeout').forEach(el => el.style.display = 'none');
        document.querySelectorAll('.btn-timeout-sub').forEach(el => el.style.display = 'none');
    }

    if (reglasActuales.usaRojas) {
        document.querySelectorAll('.btn-roja').forEach(el => el.style.display = 'block');
        document.querySelectorAll('.btn-roja-sub').forEach(el => el.style.display = 'block');
    } else {
        document.querySelectorAll('.btn-roja').forEach(el => el.style.display = 'none');
        document.querySelectorAll('.btn-roja-sub').forEach(el => el.style.display = 'none');
    }

    let divLocal = document.getElementById('botones-local');
    let divVisita = document.getElementById('botones-visita');
    divLocal.innerHTML = '';
    divVisita.innerHTML = '';

    reglasActuales.puntosBotones.forEach(pts => {
        let textBtn = reglasActuales.txtPuntos === 'Goles' ? '+1 Gol' : `+${pts}`;

        let btnL = document.createElement('button');
        btnL.innerText = textBtn;
        btnL.style.backgroundColor = colorLocal;
        if (["#ffffff","#ffeb3b","#c0ca33"].includes(colorLocal)) { btnL.style.color = 'black'; btnL.style.textShadow = 'none'; }
        btnL.onclick = () => modificarPuntos('local', pts);
        divLocal.appendChild(btnL);

        let btnV = document.createElement('button');
        btnV.innerText = textBtn;
        btnV.style.backgroundColor = colorVisita;
        if (["#ffffff","#ffeb3b","#c0ca33"].includes(colorVisita)) { btnV.style.color = 'black'; btnV.style.textShadow = 'none'; }
        btnV.onclick = () => modificarPuntos('visita', pts);
        divVisita.appendChild(btnV);
    });
}
</script>
<!-- Resto del archivo permanece igual -->
</body>
</html>
