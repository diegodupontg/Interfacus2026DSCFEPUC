<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesa de Control Inteligente - DSC</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg-color: #121212; --card-color: #1e1e1e; --text-color: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 15px; text-align: center; }
        .container { max-width: 800px; margin: auto; background: var(--card-color); padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1 { color: #ffb703; margin: 0 0 5px 0; font-size: 1.6rem; }
        .match-info { font-size: 1.1rem; color: #aaa; margin-bottom: 15px; font-weight: bold; }
        
        .timer-container { background: #000000; border: 3px solid #333; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
        .timer-display { font-family: 'Courier New', Courier, monospace; font-size: 4rem; font-weight: bold; color: #00ff00; margin-bottom: 5px; text-shadow: 0 0 10px rgba(0,255,0,0.5); cursor: pointer; }
        #periodo-display { color: #ffb703; font-size: 1.2rem; font-weight: bold; margin-bottom: 10px; text-transform: uppercase; }
        
        .timer-controls { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .btn-timer { padding: 10px 20px; font-size: 1rem; font-weight: bold; border-radius: 5px; cursor: pointer; border: none; color: white; width: auto; min-width: 100px; }
        .btn-start { background: #2e7d32; }
        .btn-pause { background: #e65100; }
        .btn-reset { background: #424242; }
        .btn-prorroga { background: #ff9800; color: black; }

        .status-badge { background: #ffb703; color: black; padding: 5px 15px; border-radius: 20px; font-weight: bold; display: inline-block; margin-bottom: 15px; cursor: pointer; }
        .grid { display: flex; gap: 15px; justify-content: space-between; margin-top: 15px; }
        
        .team-card { flex: 1; background: #2a2a2a; padding: 15px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.3); border-top: 5px solid #444; }
        .score-label { color: #888; font-size: 0.9rem; text-transform: uppercase; margin-top: 10px; letter-spacing: 1px; }
        .score { font-size: 4.5rem; font-weight: bold; margin: 5px 0 15px 0; line-height: 1; }
        
        .btn-group { display: flex; gap: 5px; margin-bottom: 5px; flex-wrap: wrap; }
        button { flex: 1; padding: 12px; font-size: 1rem; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; color: white; text-shadow: 1px 1px 2px rgba(0,0,0,0.8); }
        
        .btn-sub { background: #424242; font-size: 0.9rem; padding: 8px; margin-bottom: 10px; width: 100%; text-shadow: none; }
        .btn-foul { background: #ef6c00; width: 100%; text-shadow: none; margin-bottom: 5px; }
        
        .btn-timeout, .btn-roja { width: 100%; text-shadow: none; margin-bottom: 5px; display: none; }
        .btn-timeout-sub, .btn-roja-sub { background: #424242; font-size: 0.8rem; padding: 4px; width: 100%; text-shadow: none; display: none; margin-bottom: 10px; }
        
        .btn-timeout { background: #1976d2; }
        .btn-roja { background: #d32f2f; }
        .btn-menu { background: #c62828; margin-top: 25px; padding: 15px 30px; font-size: 1.1rem; text-shadow: none; }
        
        footer { text-align: center; padding: 20px; margin-top: 20px; color: #aaa; font-size: 0.85rem; border-top: 1px solid #333; }
        
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 10000; justify-content: center; align-items: center; overflow-y: auto; }
        .modal-content { background: white; padding: 30px; border-radius: 12px; width: 90%; max-width: 550px; color: black; text-align: left; box-shadow: 0 4px 20px rgba(0,0,0,0.5); margin-top: 20px; margin-bottom: 20px; }
        .modal-header { margin-top: 0; color: #b71c1c; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 0.85rem; font-weight: bold; color: #333; margin-bottom: 5px; }
        .input-group input, .input-group select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 1.1rem; }
        .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
        .btn-cancel { background: #e0e0e0; color: #333; text-shadow:none; padding: 10px 15px; width: auto; flex: none; }
        .btn-save { background: #2e7d32; color: white; text-shadow:none; padding: 10px 20px; width: auto; flex: none; }
        hr { margin: 15px 0; border-color: #ccc; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Mesa de Control - DSC</h1>
        <div id="match-title" class="match-info">Cargando datos del partido...</div>
        
        <div class="timer-container" id="box-cronometro">
            <div id="periodo-display">Cargando...</div>
            <div id="timer" class="timer-display" onclick="editarTiempoManual()" title="Haz clic para editar el tiempo manualmente">00:00</div>
            <div class="timer-controls">
                <button id="btn-cron-toggle" class="btn-timer btn-start" onclick="toggleCronometro()">INICIAR RELOJ</button>
                <button id="btn-siguiente-periodo" class="btn-timer btn-reset" onclick="avanzarPeriodo()">SIGUIENTE PERIODO</button>
                <button id="btn-prorroga" class="btn-timer btn-prorroga" onclick="iniciarProrroga()" style="display: none;">PRÓRROGA</button>
            </div>
        </div>

        <div>
            <select id="match-status-select" class="status-badge" style="border: none; outline: none; cursor: pointer; text-align: center; text-transform: uppercase;" onchange="cambiarEstadoManual(this.value)">
                <option value="PENDIENTE">PENDIENTE</option>
                <option value="EN VIVO">EN VIVO</option>
                <option value="PAUSADO">PAUSADO</option>
                <option value="FINALIZADO">FINALIZADO</option>
            </select>
        </div>

        <div class="grid">
            <div class="team-card" id="card-local">
                <h2 id="name-local" style="margin:0; font-size: 1.5rem;">Local</h2>
                <div class="score-label" id="label-score-local">PUNTOS</div>
                <div id="score-local" class="score">0</div>
                <div class="btn-group" id="botones-local"></div>
                <button class="btn-sub" onclick="modificarPuntos('local', -1)">-1 Deshacer</button>
                
                <button class="btn-foul" id="foul-local" onclick="modificarFaltas('local', 1)">+ Falta (0)</button>
                <button class="btn-sub" id="btn-sub-foul-local" onclick="modificarFaltas('local', -1)">-1 Falta</button>

                <button class="btn-roja" id="roja-local" onclick="modificarRojas('local', 1)">+ T. Roja (0)</button>
                <button class="btn-roja-sub" id="btn-sub-roja-local" onclick="modificarRojas('local', -1)">-1 Roja</button>

                <button class="btn-timeout" id="timeout-local" onclick="modificarTimeouts('local', 1)">+ Timeout (0)</button>
                <button class="btn-timeout-sub" id="btn-sub-timeout-local" onclick="modificarTimeouts('local', -1)">-1 Timeout</button>
            </div>

            <div class="team-card" id="card-visita">
                <h2 id="name-visita" style="margin:0; font-size: 1.5rem;">Visita</h2>
                <div class="score-label" id="label-score-visita">PUNTOS</div>
                <div id="score-visita" class="score">0</div>
                <div class="btn-group" id="botones-visita"></div>
                <button class="btn-sub" onclick="modificarPuntos('visita', -1)">-1 Deshacer</button>
                
                <button class="btn-foul" id="foul-visita" onclick="modificarFaltas('visita', 1)">+ Falta (0)</button>
                <button class="btn-sub" id="btn-sub-foul-visita" onclick="modificarFaltas('visita', -1)">-1 Falta</button>

                <button class="btn-roja" id="roja-visita" onclick="modificarRojas('visita', 1)">+ T. Roja (0)</button>
                <button class="btn-roja-sub" id="btn-sub-roja-visita" onclick="modificarRojas('visita', -1)">-1 Roja</button>

                <button class="btn-timeout" id="timeout-visita" onclick="modificarTimeouts('visita', 1)">+ Timeout (0)</button>
                <button class="btn-timeout-sub" id="btn-sub-timeout-visita" onclick="modificarTimeouts('visita', -1)">-1 Timeout</button>
            </div>
        </div>

        <div id="contenedor-boton-admin" style="margin-top: 20px;"></div>

        <button class="btn-menu" onclick="window.location.href='index.html'">Volver al Menú</button>
    </div>

    <footer>
        <p style="margin: 0 0 10px 0;">© 2026 Dupo Streaming Corporation</p>
        <span id="txt-rol-usuario" style="font-weight: bold;">👤 Verificando sesión...</span>
    </footer>

    <div id="modal-superadmin" class="modal-overlay">
        <div class="modal-content">
            <h3 class="modal-header">⚙️ Corrección Maestra</h3>
            <p style="color: #555; font-size: 0.9rem; margin-bottom: 20px;">Sobrescribe los valores actuales del partido directamente en la base de datos.</p>
            
            <div style="display: flex; gap: 15px; flex-wrap: wrap;">
                <div class="input-group" style="flex: 1;">
                    <label>Equipo Local</label>
                    <input type="text" id="admin-equipo-local" placeholder="Nombre del equipo local">
                </div>
                <div class="input-group" style="flex: 1;">
                    <label>Equipo Visitante</label>
                    <input type="text" id="admin-equipo-visitante" placeholder="Nombre del equipo visitante">
                </div>
            </div>

            <div style="display: flex; gap: 15px; flex-wrap: wrap;">
                <div class="input-group" style="flex: 1;">
                    <label>Deporte</label>
                    <input type="text" id="admin-deporte" placeholder="Ej: Fútbol, Voleibol, etc.">
                </div>
                <div class="input-group" style="flex: 1;">
                    <label>Género</label>
                    <select id="admin-genero">
                        <option value="">Seleccionar</option>
                        <option value="Varones">Varones</option>
                        <option value="Mujeres">Mujeres</option>
                        <option value="Mixto">Mixto</option>
                    </select>
                </div>
            </div>

            <div style="display: flex; gap: 15px; flex-wrap: wrap;">
                <div class="input-group" style="flex: 1;">
                    <label>Fecha (ej: Lunes 01 De Junio)</label>
                    <input type="text" id="admin-fecha" placeholder="Lunes 01 De Junio">
                </div>
                <div class="input-group" style="flex: 1;">
                    <label>Hora (ej: 17:00 - 18:00)</label>
                    <input type="text" id="admin-hora" placeholder="17:00 - 18:00">
                </div>
            </div>

            <div class="input-group">
                <label>Cancha</label>
                <input type="text" id="admin-cancha" placeholder="Nombre de la cancha / escenario">
            </div>

            <hr>

            <div style="display: flex; gap: 15px;">
                <div class="input-group" style="flex: 1;">
                    <label>Puntos Local</label>
                    <input type="number" id="admin-pts-local" min="0">
                </div>
                <div class="input-group" style="flex: 1;">
                    <label>Puntos Visita</label>
                    <input type="number" id="admin-pts-visita" min="0">
                </div>
            </div>

            <div style="display: flex; gap: 15px;">
                <div class="input-group" style="flex: 1;">
                    <label id="lbl-admin-flt">Faltas / Sets Local</label>
                    <input type="number" id="admin-flt-local" min="0">
                </div>
                <div class="input-group" style="flex: 1;">
                    <label id="lbl-admin-flt-v">Faltas / Sets Visita</label>
                    <input type="number" id="admin-flt-visita" min="0">
                </div>
            </div>

            <div style="display: flex; gap: 15px; display: none;" id="admin-rojas-container">
                <div class="input-group" style="flex: 1;">
                    <label>T. Rojas Local</label>
                    <input type="number" id="admin-rojas-local" min="0">
                </div>
                <div class="input-group" style="flex: 1;">
                    <label>T. Rojas Visita</label>
                    <input type="number" id="admin-rojas-visita" min="0">
                </div>
            </div>
            
            <div style="display: flex; gap: 15px; display: none;" id="admin-timeout-container">
                <div class="input-group" style="flex: 1;">
                    <label>Timeouts Local</label>
                    <input type="number" id="admin-to-local" min="0">
                </div>
                <div class="input-group" style="flex: 1;">
                    <label>Timeouts Visita</label>
                    <input type="number" id="admin-to-visita" min="0">
                </div>
            </div>

            <div class="modal-actions">
                <button class="btn-cancel" onclick="cerrarModalAdmin()">Cancelar</button>
                <button class="btn-save" onclick="guardarCorreccionManual()">Guardar Cambios</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://jlynumhismotkwggjfug.supabase.co';
        const SUPABASE_KEY = 'sb_publishable__WfrjXpNunfcC9XGdP9h0w_3VGUcwXT';
        const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const partidoId = new URLSearchParams(window.location.search).get('id');

        const coloresFacultades = {
            'Ciencias e Ingeniería': '#ffffff', 'Derecho': '#1a237e', 'Ciencias Sociales': '#d32f2f',
            'Gestión y Alta Dirección': '#ffeb3b', 'Arte y Diseño': '#7b1fa2', 'Estudios Generales Ciencias': '#388e3c',
            'Estudios Generales Letras': '#9e9e9e', 'Psicología': '#e91e63', 'Educación': '#03a9f4',
            'Ciencias Contables': '#0d47a1', 'Gastronomía y Hotelería': '#ff9800', 'Ciencias y Artes de la Comunicación': '#e64a19',
            'Arquitectura y Urbanismo': '#c0ca33', 'Artes Escénicas': '#ff5722', 'DEFAULT': '#555555'
        };

        // Reglas actualizadas: Fútbol con 30 min por tiempo, countdown, y posibilidad de prórroga
        const reglasDeportes = {
            'Futsal': { modoReloj: 'countdown', tiempoMins: 20, periodosText: ['1er Tiempo', '2do Tiempo'], txtPuntos: 'Goles', txtFaltas: 'Faltas', usaReloj: true, usaTimeouts: true, usaRojas: true, puntosBotones: [1] },
            'Fútbol': { modoReloj: 'countdown', tiempoMins: 30, periodosText: ['1er Tiempo', '2do Tiempo'], txtPuntos: 'Goles', txtFaltas: 'T. Amarillas', usaReloj: true, usaTimeouts: false, usaRojas: true, puntosBotones: [1] },
            'Básquetbol': { modoReloj: 'countdown', tiempoMins: 10, periodosText: ['1er Cuarto', '2do Cuarto', '3er Cuarto', '4to Cuarto'], txtPuntos: 'Puntos', txtFaltas: 'Faltas', usaReloj: true, usaTimeouts: true, usaRojas: false, puntosBotones: [1, 2, 3] },
            'Voleibol': { modoReloj: 'texto', tiempoMins: 0, periodosText: ['1er Set', '2do Set', '3er Set', '4to Set', '5to Set'], txtPuntos: 'Set', txtFaltas: 'Sets Ganados', usaReloj: false, usaTimeouts: true, usaRojas: false, puntosBotones: [1] },
            'DEFAULT': { modoReloj: 'countup', tiempoMins: 0, periodosText: ['1er Periodo', '2do Periodo'], txtPuntos: 'Puntos', txtFaltas: 'Faltas', usaReloj: true, usaTimeouts: false, usaRojas: false, puntosBotones: [1] }
        };

        let esSuperAdmin = false;
        let reglasActuales = reglasDeportes['DEFAULT'];
        let colorLocal = '#ffffff', colorVisita = '#ffffff';
        let periodoActualIndex = 0;
        let estadoPartido = "PENDIENTE";
        let puntosLocal = 0, puntosVisita = 0, faltasLocal = 0, faltasVisita = 0, timeoutsLocal = 0, timeoutsVisita = 0, rojasLocal = 0, rojasVisita = 0;
        
        let tiempoRestante = 0, intervaloCronometro = null, cronometroCorriendo = false;
        let currentMatchData = {};
        
        // Variables para manejar prórrogas en fútbol
        let prorrogaActivada = false;       // si ya se ha activado la prórroga (para no mostrar botón de nuevo)
        let tiempoSuplementarioIndex = 0;   // 0 = no activado, 1 = primer tiempo suplementario, 2 = segundo

        function formatearTiempo(segundos) {
            const total = Math.max(0, Math.floor(Number(segundos) || 0));
            const min = Math.floor(total / 60).toString().padStart(2, '0');
            const seg = (total % 60).toString().padStart(2, '0');
            return `${min}:${seg}`;
        }

        function normalizarTexto(texto = '') {
            return String(texto)
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .toLowerCase()
                .trim();
        }

        function esVoleyDeporte(texto = '') {
            const t = normalizarTexto(texto);
            return t.includes('voley') || t.includes('voleibol');
        }

        function esFutbolDeporte(texto = '') {
            const t = normalizarTexto(texto);
            return t.includes('fútbol') || t.includes('futbol');
        }

        function normalizarEstado(estado = '') {
            const e = normalizarTexto(estado);
            if (e === 'en vivo' || e === 'envivo') return 'EN VIVO';
            if (e === 'pausado') return 'PAUSADO';
            if (e === 'finalizado') return 'FINALIZADO';
            if (e === 'pendiente') return 'PENDIENTE';
            return String(estado || 'PENDIENTE').toUpperCase();
        }

        window.onload = async () => {
            const txtRol = document.getElementById("txt-rol-usuario");

            if (!partidoId) {
                document.getElementById('match-title').innerText = "⚠️ ERROR: No se detectó un partido válido.";
                document.getElementById('match-title').style.color = "#ff5252";
                txtRol.innerText = "Falta el ID del partido en la URL.";
                return; 
            }

            try {
                const { data: { user } } = await _supabase.auth.getUser();

                if (user) {
                    if (user.email === 'diegumdupont@gmail.com' || (user.app_metadata && user.app_metadata.role === 'superadmin')) {
                        esSuperAdmin = true;
                        txtRol.innerText = "🛡️ SESIÓN: SUPERADMIN ACTIVO";
                        txtRol.style.color = "#ff5252";
                        
                        document.getElementById('contenedor-boton-admin').innerHTML = `
                            <button onclick="abrirModalAdmin()" style="background: #b71c1c; color: white; width: 100%; padding: 15px; font-size: 1.1rem; border-radius: 8px; text-shadow: none; border: 2px solid #ffb703; cursor:pointer;">
                                ⚙️ ABRIR PANEL DE CORRECCIÓN (SUPERADMIN)
                            </button>
                        `;
                    } else {
                        esSuperAdmin = false;
                        txtRol.innerText = `👤 Logger: ${user.email}`;
                        txtRol.style.color = "#aaa";
                    }
                    cargarPartido();
                } else {
                    window.location.href = 'index.html';
                }
            } catch (error) { console.error("Error:", error); }
        };

        function convertirTiempoASegundos(tiempoStr, defaultMins) {
            if (!tiempoStr || !tiempoStr.includes(':')) return defaultMins * 60;
            let partes = tiempoStr.split(':');
            let min = parseInt(partes[0]);
            let seg = parseInt(partes[1]);
            if (isNaN(min)) min = defaultMins;
            if (isNaN(seg)) seg = 0;
            return (min * 60) + seg;
        }

        async function cargarPartido() {
            try {
                const { data, error } = await _supabase.from('partidos').select('*').eq('id', partidoId).single();
                if (error) throw error;

                if (data) {
                    currentMatchData = { ...data };

                    let deporteLimpio = data.deporte || "";
                    let iconoGenero = "🏆";

                    if (deporteLimpio.toLowerCase().includes("varones")) {
                        iconoGenero = "🚹";
                        deporteLimpio = deporteLimpio.replace(/varones/i, "").trim();
                    } else if (deporteLimpio.toLowerCase().includes("damas")) {
                        iconoGenero = "🚺";
                        deporteLimpio = deporteLimpio.replace(/damas/i, "").trim();
                    } else if (deporteLimpio.toLowerCase().includes("mixto")) {
                        iconoGenero = "🚻";
                        deporteLimpio = deporteLimpio.replace(/mixto/i, "").trim();
                    }

                    document.getElementById('match-title').innerText = `${iconoGenero} ${deporteLimpio} | ${data.cancha}`;
                    
                    document.getElementById('name-local').innerText = data.equipo_local;
                    document.getElementById('name-visita').innerText = data.equipo_visitante;
                    
                    puntosLocal = data.puntos_local || 0;
                    puntosVisita = data.puntos_visitante || 0;
                    faltasLocal = data.faltas_local || 0;
                    faltasVisita = data.faltas_visitante || 0;
                    timeoutsLocal = data.timeouts_local || 0;
                    timeoutsVisita = data.timeouts_visitante || 0;
                    rojasLocal = data.rojas_local || 0;
                    rojasVisita = data.rojas_visitante || 0;
                    estadoPartido = data.estado || "PENDIENTE";
                    
                    colorLocal = coloresFacultades[data.equipo_local] || coloresFacultades['DEFAULT'];
                    colorVisita = coloresFacultades[data.equipo_visitante] || coloresFacultades['DEFAULT'];
                    
                    document.getElementById('name-local').style.color = colorLocal;
                    document.getElementById('name-visita').style.color = colorVisita;
                    document.getElementById('card-local').style.borderTopColor = colorLocal;
                    document.getElementById('card-visita').style.borderTopColor = colorVisita;

                    let deporteClave = 'DEFAULT';
                    for (let key in reglasDeportes) {
                        if (data.deporte.includes(key)) deporteClave = key;
                    }
                    reglasActuales = reglasDeportes[deporteClave];
                    
                    // Reiniciar estado de prórroga si no es fútbol
                    if (!esFutbolDeporte(data.deporte)) {
                        prorrogaActivada = false;
                        tiempoSuplementarioIndex = 0;
                    }
                    
                    aplicarReglasDeporte();
                    
                    if (intervaloCronometro) clearInterval(intervaloCronometro);
                    cronometroCorriendo = false;
                    
                    // Determinar el tiempo inicial según el periodo actual (si es prórroga, usar 10 min)
                    let minutosPeriodo = reglasActuales.tiempoMins;
                    if (esFutbolDeporte(data.deporte) && tiempoSuplementarioIndex > 0) {
                        minutosPeriodo = 10; // tiempos suplementarios de 10 minutos
                    }
                    
                    if (data.tiempo_actual && reglasActuales.usaReloj) {
                        tiempoRestante = convertirTiempoASegundos(data.tiempo_actual, minutosPeriodo);
                    } else {
                        tiempoRestante = minutosPeriodo * 60;
                    }
                    
                    actualizarDisplayTiempo();
                    actualizarPantalla();
                    
                    const badge = document.getElementById('match-status-select');
                    badge.value = estadoPartido;
                    
                    if (estadoPartido === 'EN VIVO') {
                        badge.style.background = "#2e7d32"; badge.style.color = "white";
                        if(reglasActuales.usaReloj) toggleCronometro(); 
                    } else if (estadoPartido === 'PAUSADO') {
                        badge.style.background = "#ffb703"; badge.style.color = "black";
                    } else {
                        badge.style.background = "#6a1b9a"; badge.style.color = "white";
                    }
                    
                    // Mostrar/ocultar botón de prórroga según condiciones
                    actualizarBotonProrroga();
                }
            } catch (err) { console.error(err); }
        }

        function actualizarBotonProrroga() {
            const btnProrroga = document.getElementById('btn-prorroga');
            if (!btnProrroga) return;
            
            // Solo mostrar en fútbol, cuando NO se haya activado prórroga, el partido está en curso o pausado, y estamos al final del segundo tiempo (periodoActualIndex === 2)
            if (esFutbolDeporte(currentMatchData.deporte) && !prorrogaActivada && 
                (estadoPartido === 'EN VIVO' || estadoPartido === 'PAUSADO') && 
                periodoActualIndex === 2 && puntosLocal === puntosVisita) {
                btnProrroga.style.display = 'inline-block';
            } else {
                btnProrroga.style.display = 'none';
            }
        }

        function iniciarProrroga() {
            if (!esFutbolDeporte(currentMatchData.deporte)) return;
            if (prorrogaActivada) return;
            if (periodoActualIndex !== 2 || puntosLocal !== puntosVisita) {
                alert("Solo se puede activar prórroga al final del segundo tiempo y con empate en el marcador.");
                return;
            }
            
            // Confirmar
            if (confirm("¿Activar tiempos suplementarios (2 tiempos de 10 minutos cada uno)? Se reiniciará el reloj a 10:00.")) {
                prorrogaActivada = true;
                tiempoSuplementarioIndex = 1; // primer tiempo suplementario
                // Reiniciar el índice de periodos para mostrar "1er Tiempo Suplementario" etc.
                // Podemos extender el array periodosText temporalmente
                reglasActuales.periodosText = ['1er Tiempo', '2do Tiempo', '1er Tiempo Suplementario', '2do Tiempo Suplementario'];
                periodoActualIndex = 2; // avanzamos al índice del primer suplementario (2)
                // Reiniciar tiempo a 10 minutos
                tiempoRestante = 10 * 60;
                actualizarDisplayTiempo();
                // Guardar en BD el nuevo tiempo y el periodo (opcional)
                _supabase.from('partidos').update({ tiempo_actual: formatearTiempo(tiempoRestante) }).eq('id', partidoId);
                // Ocultar botón prórroga
                document.getElementById('btn-prorroga').style.display = 'none';
                // Actualizar display del periodo
                document.getElementById('periodo-display').innerText = reglasActuales.periodosText[periodoActualIndex] || 'PRÓRROGA';
                alert("Prórroga activada. El reloj se ha establecido en 10:00.");
            }
        }

        function aplicarReglasDeporte() {
            const esVoley = (reglasActuales.txtFaltas === 'Sets Ganados');
            const esFutbol = esFutbolDeporte(currentMatchData.deporte);

            document.getElementById('label-score-local').innerText = reglasActuales.txtPuntos || 'PUNTOS';
            document.getElementById('label-score-visita').innerText = reglasActuales.txtPuntos || 'PUNTOS';

            let divLocal = document.getElementById('botones-local');
            let divVisita = document.getElementById('botones-visita');

            divLocal.innerHTML = '';
            divVisita.innerHTML = '';

            // Generar botones de puntos
            if (reglasActuales.puntosBotones && reglasActuales.puntosBotones.length > 0) {
                reglasActuales.puntosBotones.forEach(valor => {
                    let btnLocal = document.createElement('button');
                    btnLocal.innerText = `+${valor} ${reglasActuales.txtPuntos || 'Punto'}`;
                    btnLocal.style.backgroundColor = colorLocal;
                    btnLocal.onclick = () => modificarPuntos('local', valor);
                    divLocal.appendChild(btnLocal);

                    let btnVisita = document.createElement('button');
                    btnVisita.innerText = `+${valor} ${reglasActuales.txtPuntos || 'Punto'}`;
                    btnVisita.style.backgroundColor = colorVisita;
                    btnVisita.onclick = () => modificarPuntos('visita', valor);
                    divVisita.appendChild(btnVisita);
                });
            } else {
                let btnPL = document.createElement('button');
                btnPL.innerText = `+1 ${reglasActuales.txtPuntos || 'Punto'}`;
                btnPL.style.backgroundColor = colorLocal;
                btnPL.onclick = () => modificarPuntos('local', 1);
                divLocal.appendChild(btnPL);

                let btnPV = document.createElement('button');
                btnPV.innerText = `+1 ${reglasActuales.txtPuntos || 'Punto'}`;
                btnPV.style.backgroundColor = colorVisita;
                btnPV.onclick = () => modificarPuntos('visita', 1);
                divVisita.appendChild(btnPV);
            }

            if(esVoley) {
                document.getElementById('box-cronometro').innerHTML = `
                    <div id="periodo-display" style="font-size:2rem;color:#ffb703;font-weight:bold;margin-bottom:15px;">
                        ${obtenerTextoPeriodo()}
                    </div>
                    <button id="btn-cambiar-set" class="btn-timer btn-start" style="width:100%;background:#ffb703;color:black;">CAMBIAR SET</button>
                `;
                document.getElementById('btn-cambiar-set').onclick = avanzarPeriodo;
                document.getElementById('foul-local').innerText = `+1 Set (${faltasLocal})`;
                document.getElementById('foul-visita').innerText = `+1 Set (${faltasVisita})`;
                document.getElementById('btn-sub-foul-local').innerText = '-1 Set';
                document.getElementById('btn-sub-foul-visita').innerText = '-1 Set';
            }

            if(reglasActuales.usaTimeouts) {
                document.querySelectorAll('.btn-timeout').forEach(el => el.style.display = 'block');
                document.querySelectorAll('.btn-timeout-sub').forEach(el => el.style.display = 'block');
            } else {
                document.querySelectorAll('.btn-timeout').forEach(el => el.style.display = 'none');
                document.querySelectorAll('.btn-timeout-sub').forEach(el => el.style.display = 'none');
            }

            if(reglasActuales.usaRojas) {
                document.querySelectorAll('.btn-roja').forEach(el => el.style.display = 'block');
                document.querySelectorAll('.btn-roja-sub').forEach(el => el.style.display = 'block');
            } else {
                document.querySelectorAll('.btn-roja').forEach(el => el.style.display = 'none');
                document.querySelectorAll('.btn-roja-sub').forEach(el => el.style.display = 'none');
            }
        }

        function obtenerTextoPeriodo() {
            if (periodoActualIndex < reglasActuales.periodosText.length) {
                return reglasActuales.periodosText[periodoActualIndex];
            }
            return "PARTIDO FINALIZADO";
        }

        function actualizarDisplayTiempo() {
            if (!reglasActuales.usaReloj) return;
            document.getElementById('timer').innerText = formatearTiempo(tiempoRestante);
        }

        async function toggleCronometro() {
            var btn = document.getElementById('btn-cron-toggle');
            var select = document.getElementById('match-status-select');

            if (intervaloCronometro) { clearInterval(intervaloCronometro); intervaloCronometro = null; }

            if (cronometroCorriendo) {
                cronometroCorriendo = false;
                btn.innerText = "INICIAR RELOJ"; btn.className = "btn-timer btn-start";
                select.value = "PAUSADO"; select.style.background = "#ffb703"; select.style.color = "black";
                sincronizarEstadoBaseDatos("PAUSADO");
                actualizarBotonProrroga();
            } else {
                cronometroCorriendo = true;
                btn.innerText = "PAUSAR RELOJ"; btn.className = "btn-timer btn-pause";
                select.value = "EN VIVO"; select.style.background = "#2e7d32"; select.style.color = "white";
                sincronizarEstadoBaseDatos("EN VIVO");

                intervaloCronometro = setInterval(async function() {
                    if (reglasActuales.modoReloj === "countdown") {
                        if (tiempoRestante > 0) tiempoRestante--;
                        else {
                            clearInterval(intervaloCronometro);
                            cronometroCorriendo = false;
                            btn.innerText = "INICIAR RELOJ"; btn.className = "btn-timer btn-start";
                            // No cambiar estado automáticamente, solo detener reloj
                            sincronizarEstadoBaseDatos("PAUSADO");
                            select.value = "PAUSADO"; select.style.background = "#ffb703";
                            // Si es fútbol y terminó el tiempo, mostrar botón prórroga si aplica
                            actualizarBotonProrroga();
                            return;
                        }
                    } else { // countup
                        tiempoRestante++;
                    }

                    actualizarDisplayTiempo();
                    
                    if (tiempoRestante % 5 === 0) {
                        let tiempoStr = formatearTiempo(tiempoRestante);
                        await _supabase.from('partidos').update({ tiempo_actual: tiempoStr }).eq('id', partidoId).catch(e=>console.error);
                    }
                }, 1000);
            }
        }

        async function sincronizarEstadoBaseDatos(nuevoEstado) {
            estadoPartido = nuevoEstado;
            let tiempoStr = formatearTiempo(tiempoRestante);
            await _supabase.from('partidos').update({ estado: nuevoEstado, tiempo_actual: tiempoStr }).eq('id', partidoId);
        }

        async function avanzarPeriodo() {
            if (intervaloCronometro) clearInterval(intervaloCronometro);
            cronometroCorriendo = false;
            
            periodoActualIndex++;
            
            // Si es fútbol y estamos en el segundo tiempo reglamentario (índice 2) y aún no se activó prórroga, 
            // verificar si hay empate para mostrar botón, pero no avanzamos más allá.
            if (esFutbolDeporte(currentMatchData.deporte) && !prorrogaActivada && periodoActualIndex === 2) {
                // Al final del segundo tiempo, no avanzamos automáticamente a un tercer periodo.
                // Mostramos el botón de prórroga si hay empate.
                document.getElementById('periodo-display').innerText = reglasActuales.periodosText[periodoActualIndex-1] + " (FINALIZADO)";
                actualizarBotonProrroga();
                // Detenemos el reloj si estaba corriendo
                if (cronometroCorriendo) {
                    cronometroCorriendo = false;
                    document.getElementById('btn-cron-toggle').innerText = "INICIAR RELOJ";
                    document.getElementById('btn-cron-toggle').className = "btn-timer btn-start";
                }
                return;
            }
            
            // Para otros deportes, o si ya se activó prórroga, continuar
            let textoPeriodo = reglasActuales.periodosText[periodoActualIndex];
            
            if(periodoActualIndex >= reglasActuales.periodosText.length) {
                textoPeriodo = "PARTIDO FINALIZADO"; 
                document.getElementById('periodo-display').innerText = textoPeriodo;
                document.getElementById('match-status-select').value = "FINALIZADO";
                document.getElementById('match-status-select').style.background = "#6a1b9a";
                await cambiarEstadoManual("FINALIZADO");
                return;
            }
            
            document.getElementById('periodo-display').innerText = textoPeriodo;
            
            if (reglasActuales.usaReloj) {
                // Determinar minutos del nuevo periodo
                let minutosNuevoPeriodo = reglasActuales.tiempoMins;
                if (esFutbolDeporte(currentMatchData.deporte) && prorrogaActivada && (periodoActualIndex === 2 || periodoActualIndex === 3)) {
                    minutosNuevoPeriodo = 10; // tiempos suplementarios
                }
                tiempoRestante = minutosNuevoPeriodo * 60; 
                actualizarDisplayTiempo();
                var btn = document.getElementById('btn-cron-toggle');
                btn.innerText = "INICIAR RELOJ"; btn.className = "btn-timer btn-start"; btn.disabled = false;
                
                document.getElementById('match-status-select').value = "PENDIENTE";
                document.getElementById('match-status-select').style.background = "#ffb703";
                document.getElementById('match-status-select').style.color = "black";
                await sincronizarEstadoBaseDatos("PENDIENTE");
            } else {
                // Lógica para vóley, etc.
                let ganador = puntosLocal > puntosVisita ? 'local' : (puntosVisita > puntosLocal ? 'visita' : null);
                if (ganador) {
                    if (ganador === 'local') faltasLocal++; else faltasVisita++;
                }
                puntosLocal = 0; puntosVisita = 0;
                actualizarPantalla();
                await _supabase.from('partidos').update({ puntos_local: 0, puntos_visitante: 0, faltas_local: faltasLocal, faltas_visitante: faltasVisita }).eq('id', partidoId);
            }
        }

        async function cambiarEstadoManual(nuevoEstado) {
            if(nuevoEstado !== 'EN VIVO' && intervaloCronometro) {
                clearInterval(intervaloCronometro);
                cronometroCorriendo = false;
                if(document.getElementById('btn-cron-toggle')) {
                    document.getElementById('btn-cron-toggle').innerText = "INICIAR RELOJ";
                    document.getElementById('btn-cron-toggle').className = "btn-timer btn-start";
                }
            }
            
            if (nuevoEstado === 'FINALIZADO' && reglasActuales.txtFaltas === 'Sets Ganados') {
                if (faltasLocal > 0 || faltasVisita > 0) {
                    puntosLocal = faltasLocal;
                    puntosVisita = faltasVisita;
                    faltasLocal = 0;
                    faltasVisita = 0;
                    actualizarPantalla();
                    await _supabase.from('partidos').update({ 
                        puntos_local: puntosLocal, puntos_visitante: puntosVisita, 
                        faltas_local: faltasLocal, faltas_visitante: faltasVisita 
                    }).eq('id', partidoId);
                }
            }
            
            await sincronizarEstadoBaseDatos(nuevoEstado);
            
            if(nuevoEstado === 'EN VIVO' && reglasActuales.usaReloj && !cronometroCorriendo) {
                toggleCronometro();
            }
            actualizarBotonProrroga();
        }

        function actualizarPantalla() {
            const esVoley = esVoleyDeporte(reglasActuales.txtFaltas) || esVoleyDeporte(reglasActuales.txtPuntos);

            document.getElementById('score-local').innerText = puntosLocal;
            document.getElementById('score-visita').innerText = puntosVisita;

            document.getElementById('foul-local').innerText = esVoley ? `+ Set (${faltasLocal})` : `+ ${reglasActuales.txtFaltas} (${faltasLocal})`;
            document.getElementById('foul-visita').innerText = esVoley ? `+ Set (${faltasVisita})` : `+ ${reglasActuales.txtFaltas} (${faltasVisita})`;
            document.getElementById('btn-sub-foul-local').innerText = esVoley ? `-1 Set` : `-1 ${reglasActuales.txtFaltas}`;
            document.getElementById('btn-sub-foul-visita').innerText = esVoley ? `-1 Set` : `-1 ${reglasActuales.txtFaltas}`;

            document.getElementById('roja-local').innerText = `+ T. Roja (${rojasLocal})`;
            document.getElementById('roja-visita').innerText = `+ T. Roja (${rojasVisita})`;

            document.getElementById('timeout-local').innerText = `+ Timeout (${timeoutsLocal})`;
            document.getElementById('timeout-visita').innerText = `+ Timeout (${timeoutsVisita})`;
        }

        async function modificarPuntos(equipo, cant) {
            if (equipo === 'local') puntosLocal = Math.max(0, puntosLocal + cant);
            else puntosVisita = Math.max(0, puntosVisita + cant);
            
            actualizarPantalla();
            await _supabase.from('partidos').update({ puntos_local: puntosLocal, puntos_visitante: puntosVisita }).eq('id', partidoId);

            if (cant > 0 && reglasActuales.txtFaltas === 'Sets Ganados') {
                let ptsGanador = equipo === 'local' ? puntosLocal : puntosVisita;
                let ptsPerdedor = equipo === 'local' ? puntosVisita : puntosLocal;
                
                let limitePuntos = (periodoActualIndex >= 2) ? 15 : 25; 

                if (ptsGanador >= limitePuntos && (ptsGanador - ptsPerdedor) >= 2) {
                    setTimeout(async () => {
                        if (equipo === 'local') faltasLocal++; else faltasVisita++;
                        
                        if (faltasLocal === 2 || faltasVisita === 2) {
                            puntosLocal = faltasLocal;
                            puntosVisita = faltasVisita;
                            faltasLocal = 0;
                            faltasVisita = 0;
                            
                            document.getElementById('match-status-select').value = "FINALIZADO";
                            document.getElementById('periodo-display').innerText = "PARTIDO FINALIZADO";
                            
                            actualizarPantalla();
                            
                            await _supabase.from('partidos').update({ 
                                puntos_local: puntosLocal, 
                                puntos_visitante: puntosVisita, 
                                faltas_local: 0, 
                                faltas_visitante: 0,
                                estado: "FINALIZADO"
                            }).eq('id', partidoId);
                            
                            estadoPartido = "FINALIZADO";
                        } else {
                            puntosLocal = 0; 
                            puntosVisita = 0;
                            periodoActualIndex++;
                            
                            document.getElementById('periodo-display').innerText = reglasActuales.periodosText[periodoActualIndex] || "SET EXTRA";
                            actualizarPantalla();
                            
                            await _supabase.from('partidos').update({ 
                                puntos_local: 0, 
                                puntos_visitante: 0, 
                                faltas_local: faltasLocal, 
                                faltas_visitante: faltasVisita 
                            }).eq('id', partidoId);
                        }
                    }, 500); 
                }
            }
            
            // Actualizar botón de prórroga por si cambió el marcador después del segundo tiempo
            actualizarBotonProrroga();
        }

        async function modificarFaltas(equipo, cant) {
            if (equipo === 'local') faltasLocal = Math.max(0, faltasLocal + cant);
            else faltasVisita = Math.max(0, faltasVisita + cant);
            actualizarPantalla();
            await _supabase.from('partidos').update({ faltas_local: faltasLocal, faltas_visitante: faltasVisita }).eq('id', partidoId);
        }

        async function modificarRojas(equipo, cant) {
            if (equipo === 'local') rojasLocal = Math.max(0, rojasLocal + cant);
            else rojasVisita = Math.max(0, rojasVisita + cant);
            actualizarPantalla();
            await _supabase.from('partidos').update({ rojas_local: rojasLocal, rojas_visitante: rojasVisita }).eq('id', partidoId);
        }

        async function modificarTimeouts(equipo, cant) {
            if (equipo === 'local') timeoutsLocal = Math.max(0, timeoutsLocal + cant);
            else timeoutsVisita = Math.max(0, timeoutsVisita + cant);
            actualizarPantalla();
            await _supabase.from('partidos').update({ timeouts_local: timeoutsLocal, timeouts_visitante: timeoutsVisita }).eq('id', partidoId);
        }

        function abrirModalAdmin() {
            document.getElementById('admin-equipo-local').value = currentMatchData.equipo_local || '';
            document.getElementById('admin-equipo-visitante').value = currentMatchData.equipo_visitante || '';
            document.getElementById('admin-deporte').value = currentMatchData.deporte || '';
            document.getElementById('admin-genero').value = currentMatchData.genero || '';
            document.getElementById('admin-fecha').value = currentMatchData.fecha || '';
            document.getElementById('admin-hora').value = currentMatchData.hora_inicio || '';
            document.getElementById('admin-cancha').value = currentMatchData.cancha || '';

            document.getElementById('admin-pts-local').value = puntosLocal;
            document.getElementById('admin-pts-visita').value = puntosVisita;
            document.getElementById('admin-flt-local').value = faltasLocal;
            document.getElementById('admin-flt-visita').value = faltasVisita;
            
            if(reglasActuales.txtFaltas === 'Sets Ganados') {
                document.getElementById('lbl-admin-flt').innerText = "Sets Local";
                document.getElementById('lbl-admin-flt-v').innerText = "Sets Visita";
            } else {
                document.getElementById('lbl-admin-flt').innerText = "Faltas / Amarillas Local";
                document.getElementById('lbl-admin-flt-v').innerText = "Faltas / Amarillas Visita";
            }
            
            if(reglasActuales.usaTimeouts) {
                document.getElementById('admin-timeout-container').style.display = 'flex';
                document.getElementById('admin-to-local').value = timeoutsLocal;
                document.getElementById('admin-to-visita').value = timeoutsVisita;
            } else {
                document.getElementById('admin-timeout-container').style.display = 'none';
            }

            if(reglasActuales.usaRojas) {
                document.getElementById('admin-rojas-container').style.display = 'flex';
                document.getElementById('admin-rojas-local').value = rojasLocal;
                document.getElementById('admin-rojas-visita').value = rojasVisita;
            } else {
                document.getElementById('admin-rojas-container').style.display = 'none';
            }
            
            document.getElementById('modal-superadmin').style.display = 'flex';
        }

        function cerrarModalAdmin() { document.getElementById('modal-superadmin').style.display = 'none'; }

        async function guardarCorreccionManual() {
            const nuevoEquipoLocal = document.getElementById('admin-equipo-local').value.trim();
            const nuevoEquipoVisitante = document.getElementById('admin-equipo-visitante').value.trim();
            const nuevoDeporte = document.getElementById('admin-deporte').value.trim();
            const nuevoGenero = document.getElementById('admin-genero').value;
            const nuevaFecha = document.getElementById('admin-fecha').value.trim();
            const nuevaHora = document.getElementById('admin-hora').value.trim();
            const nuevaCancha = document.getElementById('admin-cancha').value.trim();

            if (!nuevoEquipoLocal || !nuevoEquipoVisitante) {
                alert("Los nombres de los equipos no pueden estar vacíos.");
                return;
            }

            puntosLocal = parseInt(document.getElementById('admin-pts-local').value) || 0;
            puntosVisita = parseInt(document.getElementById('admin-pts-visita').value) || 0;
            faltasLocal = parseInt(document.getElementById('admin-flt-local').value) || 0;
            faltasVisita = parseInt(document.getElementById('admin-flt-visita').value) || 0;
            
            if(reglasActuales.usaTimeouts) {
                timeoutsLocal = parseInt(document.getElementById('admin-to-local').value) || 0;
                timeoutsVisita = parseInt(document.getElementById('admin-to-visita').value) || 0;
            }

            if(reglasActuales.usaRojas) {
                rojasLocal = parseInt(document.getElementById('admin-rojas-local').value) || 0;
                rojasVisita = parseInt(document.getElementById('admin-rojas-visita').value) || 0;
            }

            const updateData = {
                equipo_local: nuevoEquipoLocal,
                equipo_visitante: nuevoEquipoVisitante,
                deporte: nuevoDeporte,
                genero: nuevoGenero,
                fecha: nuevaFecha,
                hora_inicio: nuevaHora,
                cancha: nuevaCancha,
                puntos_local: puntosLocal,
                puntos_visitante: puntosVisita,
                faltas_local: faltasLocal,
                faltas_visitante: faltasVisita,
                timeouts_local: timeoutsLocal,
                timeouts_visitante: timeoutsVisita,
                rojas_local: rojasLocal,
                rojas_visitante: rojasVisita
            };

            actualizarPantalla();

            try {
                const { error } = await _supabase.from('partidos').update(updateData).eq('id', partidoId);
                if (error) throw error;
                
                await cargarPartido();
                cerrarModalAdmin();
                alert("Partido actualizado correctamente.");
            } catch (error) { alert("Error: " + error.message); }
        }

        function editarTiempoManual() {
            const nuevoValor = prompt("Introduce el tiempo exacto (formato MM:SS):", formatearTiempo(tiempoRestante));
            if (nuevoValor && nuevoValor.match(/^\d{1,2}:\d{2}$/)) {
                const partes = nuevoValor.split(':');
                let minutos = parseInt(partes[0]);
                let segundos = parseInt(partes[1]);
                if (!isNaN(minutos) && !isNaN(segundos)) {
                    tiempoRestante = minutos * 60 + segundos;
                    actualizarDisplayTiempo();
                    _supabase.from('partidos').update({ tiempo_actual: formatearTiempo(tiempoRestante) }).eq('id', partidoId);
                } else {
                    alert("Formato inválido. Use MM:SS");
                }
            } else if (nuevoValor) {
                alert("Formato inválido. Use MM:SS");
            }
        }
    </script>
