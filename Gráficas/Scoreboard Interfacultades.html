<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scorebug Multideporte - Interfacultades 2026</title>
  <style>
    /* ==========================================================
       1. VARIABLES GLOBALES Y PANEL STUDIO DSC
       ========================================================== */
    :root {
      --bg: transparent;
      --panel: #182235;
      --panel-2: #202b3f;
      --line: rgba(255,255,255,0.14);
      --text: #f5f7fb;
      --muted: #98a5bf;
      --accent: #19c6f3;
      --shadow: 0 18px 50px rgba(0,0,0,0.35);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: transparent; color: var(--text);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }
    .app { width: 100%; height: 100%; position: relative; }

    .overlay-root {
      position: relative; width: 100%; height: 100%;
      pointer-events: none; background: transparent;
    }
    
    .scorebug-container {
      pointer-events: auto;
      display: none;
    }
    .scorebug-container.active { display: flex; }

    /* ==========================================================
       CONTENEDOR INFERIOR PARA CENTRADO PERFECTO
       ========================================================== */
    .bottom-boards-wrapper {
        position: absolute;
        bottom: 120px; /* Separación del bottomline */
        left: 0;
        width: 100%;
        display: flex;
        justify-content: center; /* Esto asegura que SIEMPRE esté centrado */
        pointer-events: none;
    }

    /* ==========================================================
       2. ESTILOS FÚTBOL / FUTSAL (ARRIBA IZQUIERDA)
       ========================================================== */
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&display=swap');
    
    .futbol-board {
        position: absolute;
        top: 40px; 
        left: 40px;
        font-family: 'Montserrat', 'Segoe UI', sans-serif;
        flex-direction: column; align-items: flex-start;
        filter: drop-shadow(0px 4px 6px rgba(0, 0, 0, 0.4)); 
        
        /* ESCALA EXACTA SOLICITADA */
        transform: scale(2.5);
        transform-origin: top left;
    }
    .futbol-board .league-tag {
        background-color: #0b0c0e; color: #ffffff; font-size: 11px;
        font-weight: 600; text-transform: uppercase; padding: 4px 8px;
        letter-spacing: 0.5px; margin-bottom: 0;
    }
    .futbol-board .main-bar { display: flex; height: 31.5px; color: white; }
    .futbol-board .team-liv { background-color: #d8182b; display: flex; align-items: center; padding: 0 16px; }
    .futbol-board .team-name { font-size: 20px; font-weight: 600; text-shadow: 0 1px 3px rgba(0,0,0,0.4); } 
    .futbol-board .score-liv { background-color: #9f0c1a; font-size: 24px; font-weight: 600; padding: 0 14px; display: flex; align-items: center; justify-content: center; text-shadow: 0 1px 3px rgba(0,0,0,0.4); }
    .futbol-board .score-bou { background-color: #0c3078; font-size: 24px; font-weight: 600; padding: 0 14px; display: flex; align-items: center; justify-content: center; text-shadow: 0 1px 3px rgba(0,0,0,0.4); }
    .futbol-board .team-bou { background-color: #1a5cd7; display: flex; align-items: center; padding: 0 16px; }
    .futbol-board .timer { background-color: #f1f2f5; color: #212529; font-size: 22px; font-weight: 600; display: flex; align-items: center; justify-content: center; padding: 0 16px; }

    /* ==========================================================
       3. ESTILOS VOLEIBOL (CENTRO INFERIOR)
       ========================================================== */
    .voley-board {
        position: relative; /* Cambiado a relativo dentro del wrapper flex */
        flex-direction: column; filter: drop-shadow(0px 3px 5px rgba(0, 0, 0, 0.4)); font-family: 'Arial', sans-serif;
        
        /* ESCALA EXACTA SOLICITADA */
        transform: scale(2.5);
        transform-origin: bottom center;
        pointer-events: auto;
    }
    .voley-board .top-tag {
        background-color: #373536; color: #ffffff; font-size: 11px; font-weight: 700; padding: 2px 5px;
        border: 1px solid #ffffff; box-shadow: 0 0 0 1px #373536; align-self: flex-start;
        margin-left: 2px; margin-bottom: 2px; letter-spacing: 0.3px; text-transform: uppercase;
    }
    .voley-board .main-bar {
        display: flex; background: linear-gradient(to bottom, #fdfdfd 0%, #e6e6e6 50%, #dcdcdc 100%);
        border-top: 1px solid #ffffff; border-bottom: 2px solid #8e8d89; height: 34px;
    }
    .voley-board .team-block { display: flex; position: relative; border-right: 1px solid #b3b3b3; }
    .voley-board .logo-box { width: 44px; display: flex; justify-content: center; align-items: center; border-right: 1px solid #c8c8c8; background-color: #ffffff; }
    .voley-board .info-box { width: 140px; display: flex; align-items: center; justify-content: space-between; padding: 0 8px 0 6px; box-sizing: border-box; }
    .voley-board .name-area { display: flex; align-items: center; }
    .voley-board .team-name { font-size: 15px; font-weight: 700; color: #373536; }
    .voley-board .score { font-size: 22px; font-weight: 700; color: #373536; }
    .voley-board .set-info {
        background-color: #2b2b2b; color: #ffffff; font-size: 12px; font-weight: 700;
        display: flex; align-items: center; justify-content: center; padding: 0 12px;
        border-left: 1px solid #000; text-transform: uppercase;
    }


    /* ==========================================================
       4. ESTILOS BÁSQUETBOL (CENTRO INFERIOR)
       ========================================================== */
    .basket-board * { box-sizing: border-box; margin: 0; padding: 0; }
    .basket-board {
        position: relative; /* Cambiado a relativo dentro del wrapper flex */
        width: 480px; /* Diseño apretado mantenido */
        height: 60px; font-family: 'Arial Black', 'Impact', Arial, sans-serif; user-select: none;
        
        /* ESCALA EXACTA SOLICITADA */
        transform: scale(2.5);
        transform-origin: bottom center;
        pointer-events: auto;
    }
    .basket-board .panel-izquierdo { flex: 1; background-color: #061027; display: flex; flex-direction: column; }
    .basket-board .izq-superior { 
        flex: 1; display: flex; align-items: center; justify-content: space-between; 
        padding-left: 12px; padding-right: 6px; 
    }
    .basket-board .izq-nombre { color: #ffffff; font-size: 16px; font-weight: 900; letter-spacing: 0.5px; margin-top: 2px; text-shadow: 0 1px 3px rgba(0,0,0,0.6); text-transform: uppercase; }
    
    .basket-board .izq-grupo-puntos { display: flex; align-items: center; gap: 6px; }
    /* Indicadores de Timeout verticales IZQUIERDA */
    .basket-board .timeout-col.left { display: flex; flex-direction: column; gap: 3px; }
    
    .basket-board .izq-puntuacion { color: #ffffff; font-size: 38px; font-weight: 900; line-height: 1; text-shadow: 0 1px 3px rgba(0,0,0,0.6); }
    
    .basket-board .panel-central { width: 90px; background-color: #000000; border-left: 2px solid #ffffff; border-right: 2px solid #ffffff; display: flex; flex-direction: column; justify-content: center; align-items: center; padding-top: 2px; }
    .basket-board .reloj-juego { color: #ffffff; font-size: 26px; font-weight: 900; line-height: 1; }
    .basket-board .central-sub { display: flex; align-items: center; gap: 8px; margin-top: -2px; }
    .basket-board .periodo { color: #ffffff; font-size: 14px; font-weight: 900; text-transform: uppercase; }

    .basket-board .panel-derecho { flex: 1; background-color: #061027; display: flex; flex-direction: column; }
    .basket-board .der-superior { 
        flex: 1; display: flex; align-items: center; justify-content: space-between; 
        padding-left: 6px; padding-right: 12px; 
    }
    
    .basket-board .der-grupo-puntos { display: flex; align-items: center; gap: 6px; }
    /* Indicadores de Timeout verticales DERECHA */
    .basket-board .timeout-col.right { display: flex; flex-direction: column; gap: 3px; }
    
    .basket-board .der-puntuacion { color: #ffffff; font-size: 38px; font-weight: 900; line-height: 1; text-shadow: 0 1px 3px rgba(0,0,0,0.6); }
    .basket-board .der-nombre { color: #ffffff; font-size: 16px; font-weight: 900; letter-spacing: 0.5px; margin-top: 2px; text-shadow: 0 1px 3px rgba(0,0,0,0.6); text-transform: uppercase; }
    
    /* Configuración de la barra inferior (Solo Faltas y Bonus) */
    .basket-board .izq-inferior { height: 18px; display: flex; align-items: center; justify-content: flex-start; gap: 15px; padding-left: 12px; }
    .basket-board .der-inferior { height: 18px; display: flex; align-items: center; justify-content: flex-end; gap: 15px; padding-right: 12px; }
    
    .basket-board .texto-inferior { color: #ffffff; font-size: 10px; font-weight: 900; letter-spacing: 0.5px; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }
    
    .basket-board .bonus { visibility: hidden; }
    .basket-board .bonus.active { visibility: visible; }

    .basket-board .dot { width: 5px; height: 5px; background-color: #ffffff; border-radius: 50%; box-shadow: 0 1px 2px rgba(0,0,0,0.8); transition: opacity 0.3s; }
    .basket-board .dot.off { opacity: 0.2; }

    /* ==========================================================
       5. INTERFAZ DE CONTROL
       ========================================================== */
    .obs-menu-btn {
      position: absolute; right: 18px; bottom: 18px;
      pointer-events: auto;
      border: 1px solid rgba(255,255,255,0.14); border-radius: 999px;
      background: rgba(10,14,23,0.76); color: #ecf2ff; font-size: 14px;
      font-weight: 700; padding: 12px 22px; cursor: pointer;
      backdrop-filter: blur(8px); box-shadow: 0 10px 26px rgba(0,0,0,0.24);
      z-index: 999;
    }
    .obs-menu-btn.hidden { display: none; }
    .studio-shell {
      position: absolute; inset: 0; display: flex; align-items: center;
      justify-content: center; padding: 20px; pointer-events: none;
      z-index: 100;
    }
    .studio-shell.hidden { display: none; }
    .panel {
      background: linear-gradient(180deg, rgba(23,32,49,0.96), rgba(16,22,35,0.96));
      border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow);
      display: flex; flex-direction: column;
      max-height: 90vh;
    }
    .controls { width: min(100%, 720px); padding: 18px; pointer-events: auto; }
    .panel-title { margin: 0 0 6px; font-size: 30px; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; }
    .panel-subtitle { margin: 0 0 18px; color: var(--muted); font-size: 13px; font-weight: 700; text-transform: uppercase; }
    
    .date-control {
      display: flex; align-items: center; gap: 10px; margin-bottom: 14px;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px; padding: 5px;
    }
    .date-btn {
      background: rgba(255,255,255,0.1); border: none; color: white;
      border-radius: 6px; padding: 8px 15px; cursor: pointer;
      font-weight: bold; font-size: 16px; transition: 0.2s;
    }
    .date-btn:hover { background: rgba(25, 198, 243, 0.4); }
    .date-display {
      flex: 1; text-align: center; color: #f8fbff; font-weight: 800; font-size: 16px;
      text-transform: uppercase;
    }
    
    .field { margin-bottom: 14px; }
    .field label { display: block; margin-bottom: 7px; color: #bcc8de; font-size: 12px; font-weight: 800; text-transform: uppercase; }
    .button { cursor: pointer; width: 100%; min-height: 46px; border-radius: 10px; background: linear-gradient(180deg, #1ad0ff, #11b8e4); color: #04121d; border: none; text-transform: uppercase; font-weight: 900; }
    .button.secondary { background: rgba(255,255,255,0.04); color: #f8fbff; border: 1px solid rgba(255,255,255,0.12); }
    .button-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .match-list { display: flex; flex-direction: column; gap: 8px; flex: 1; overflow-y: auto; margin-bottom: 12px; }
    .match-item { width: 100%; text-align: left; border: 1px solid rgba(255,255,255,0.10); border-radius: 10px; background: rgba(255,255,255,0.03); color: #f8fbff; padding: 11px 12px; cursor: pointer; transition: 0.2s; }
    .match-item:hover { background: rgba(255,255,255,0.08); }
    .match-item.active { border-color: var(--accent); background: rgba(25, 198, 243, 0.12); box-shadow: inset 3px 0 0 var(--accent); }
    .match-main { display: block; font-size: 15px; font-weight: 800; margin-bottom: 4px; }
    .match-sub { display: block; font-size: 12px; color: var(--muted); font-weight: 700; text-transform: uppercase; }
  </style>
</head>
<body>

  <script>
const apiUrl = "https://jlynumhismotkwggjfug.supabase.co/functions/v1/scoreboard?token=dupocorp_2026";

let matchesData = [];
let activeMatch = null;
let refreshInterval = null;

let localSeconds = 0;
let localIsRunning = false;
let lastApiTimeRaw = null; 
let currentDate = new Date(); // Fecha local normal
let basketQuarterState = {}; // Estado por partido para inferir cuartos en basket

function parseTime(str) {
  if (!str) return 0;
  const clean = String(str).trim();
  const parts = clean.split(':');
  if (parts.length === 2) {
     return parseInt(parts[0] || 0, 10) * 60 + parseInt(parts[1] || 0, 10);
  }
  return parseInt(clean, 10) || 0; 
}

function formatTime(secs) {
  if (secs < 0) secs = 0;
  const m = Math.floor(secs / 60);
  const s = secs % 60;
  return (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s);
}

function inferBasketPeriod(matchId, rawTime) {
  const key = String(matchId ?? "basket");
  const currentClock = String(rawTime ?? "").trim();
  const state = basketQuarterState[key] || { quarter: 1, lastClock: null };

  // Solo incrementa cuando el reloj vuelve a 10:00 después de haber estado en otro valor.
  if (currentClock === "10:00") {
    if (state.lastClock !== null && state.lastClock !== "10:00") {
      state.quarter += 1;
    }
  }

  state.lastClock = currentClock;
  basketQuarterState[key] = state;
  return `${state.quarter}Q`;
}

function updateClocks() {
  const timeStr = formatTime(localSeconds);
  const fTime = document.getElementById("f-time");
  const bTime = document.getElementById("b-time");
  if (fTime) fTime.innerText = timeStr;
  if (bTime) bTime.innerText = timeStr;
}

setInterval(() => {
    if (localIsRunning && activeMatch) {
        if (activeMatch.type === "basket" || activeMatch.type === "futsal") {
            if (localSeconds > 0) localSeconds--;
        } else if (activeMatch.type === "futbol") {
            localSeconds++;
        }
        updateClocks();
    }
}, 1000);

const facultyRules = [
  { aliases: ["generales letras", "generales de letras", "eeggll"], short: "EEGGLL", color: "#808080", textColor: "#FFFFFF" }, 
  { aliases: ["letras y ciencias humanas", "letras y cc hh"], short: "LLCCHH", color: "#701C2C", textColor: "#FFFFFF" }, 
  { aliases: ["generales ciencias", "generales de ciencias", "eeggcc"], short: "EEGGCC", color: "#90EE90", textColor: "#000000" }, 
  { aliases: ["ciencias e ingeniería", "ciencias e ingenieria", "faci"], short: "FACI", color: "#FFFFFF", textColor: "#000000" }, 
  { aliases: ["artes escénicas", "artes escenicas", "fares"], short: "FARES", color: "#0F766E", textColor: "#FFFFFF" },
  { aliases: ["gastronomía", "gastronomia", "ghot"], short: "GHOT", color: "#D97706", textColor: "#FFFFFF" },
  { aliases: ["arte y diseño", "ayd"], short: "AyD", color: "#E727F5", textColor: "#FFFFFF" },
  { aliases: ["derecho", "der"], short: "DER", color: "#1E3A8A", textColor: "#FFFFFF" },
  { aliases: ["educación", "educacion", "educa"], short: "EDUCA", color: "#FF8C00", textColor: "#FFFFFF" }, 
  { aliases: ["comunicación", "comunicacion", "comunica", "com"], short: "COMUNICA", color: "#000000", textColor: "#FFFFFF" },
  { aliases: ["psicología", "psicologia", "psi"], short: "PSI", color: "#7C3AED", textColor: "#FFFFFF" },
  { aliases: ["arquitectura", "arqui", "arq"], short: "ARQUI", color: "#00688B", textColor: "#FFFFFF" }, 
  { aliases: ["ciencias sociales", "ccss"], short: "CCSS", color: "#DC2626", textColor: "#FFFFFF" },
  { aliases: ["gestión", "gestion", "gest"], short: "GESTIÓN", color: "#FFD700", textColor: "#000000" }, 
  { aliases: ["contabilidad", "conta"], short: "CONTA", color: "#00BFFF", textColor: "#FFFFFF" } 
];

function normalizeText(value = "") {
  return value.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9\s]/g, " ").replace(/\s+/g, " ").trim();
}

function hashColor(input = "") {
  const cleaned = normalizeText(input);
  let hash = 0;
  for (let i = 0; i < cleaned.length; i++) {
    hash = cleaned.charCodeAt(i) + ((hash << 5) - hash);
    hash |= 0;
  }
  return `hsl(${Math.abs(hash) % 360}, 68%, 42%)`;
}

function detectFaculty(teamName = "") {
  const normalized = normalizeText(teamName);
  for (const rule of facultyRules) {
    for (const alias of rule.aliases) {
      if (normalized.includes(normalizeText(alias))) return { short: rule.short, color: rule.color, textColor: rule.textColor };
    }
  }
  const words = normalized.split(" ").filter(Boolean).filter(w => !["de", "del", "la", "el", "los", "las", "y", "e", "en"].includes(w));
  let short = words.slice(0, 3).map(w => w[0]).join("").toUpperCase();
  if (!short || short.length < 3) short = teamName.substring(0, 3).toUpperCase() || "EQP";
  return { short, color: hashColor(teamName), textColor: "#FFFFFF" };
}

// FORMATO DE FECHA LOCAL
function formatDateForDisplay(date) {
    const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    return date.toLocaleDateString('es-ES', options);
}

// OBTENER ISO ESTRICTAMENTE LOCAL (YYYY-MM-DD) PARA EVITAR DESFASE
function getLocalISODate(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
}

function updateDateDisplay() {
    const display = document.getElementById("dateDisplay");
    if(display) display.innerText = formatDateForDisplay(currentDate);
}

function changeDate(days) {
    currentDate.setDate(currentDate.getDate() + days);
    updateDateDisplay();
    fetchGames();
}

document.getElementById("prevDateBtn")?.addEventListener("click", () => changeDate(-1));
document.getElementById("nextDateBtn")?.addEventListener("click", () => changeDate(1));

// Inicializamos la UI
updateDateDisplay();

function getField(obj, possibleKeys, fallback = "") {
  for (const k of possibleKeys) {
    if (obj?.[k] !== undefined && obj?.[k] !== null) return obj[k];
  }
  return fallback;
}

function normalizeSpanishDate(dateStr) {
  if (!dateStr) return null;
  const months = { enero:"01", febrero:"02", marzo:"03", abril:"04", mayo:"05", junio:"06", julio:"07", agosto:"08", septiembre:"09", setiembre:"09", octubre:"10", noviembre:"11", diciembre:"12" };
  const match = normalizeText(dateStr).match(/(\d{1,2})\s+de\s+([a-z]+)/i);
  if (!match || !months[match[2]]) return null;
  return `2026-${months[match[2]]}-${match[1].padStart(2, "0")}`;
}

function pickTeamDisplay(teamName = "", faculty = null) {
  if (faculty?.short) return faculty.short;
  const trimmed = String(teamName || "").trim();
  return trimmed.length <= 10 ? trimmed : trimmed.substring(0, 10).toUpperCase();
}

function applyTeamTheme(selector, color) {
  const el = document.querySelector(selector);
  if (el) el.style.backgroundColor = color;
}

function normalizeMatch(m) {
  const sportStr = normalizeText(getField(m, ["sport", "deporte", "category", "categoria"], ""));
  let type = "futbol";

  if (sportStr.includes("futsal") || sportStr.includes("fulbito")) type = "futsal";
  else if (sportStr.includes("voley") || sportStr.includes("voleibol")) type = "voley";
  else if (sportStr.includes("basket") || sportStr.includes("basquet") || sportStr.includes("baloncesto")) type = "basket";

  let defaultTime = "00:00";
  if (type === "futsal") defaultTime = "20:00";
  if (type === "basket") defaultTime = "10:00";

  const team1 = getField(m, ["equipo_local", "team1", "homeTeam", "equipoLocal"], "LOCAL");
  const team2 = getField(m, ["equipo_visitante", "team2", "awayTeam", "equipoVisitante"], "VISITA");
  const marcador = m.marcador || {};

  let isRunning = false;
  const est = String(m.estado || "").toUpperCase();

  if (est.includes("EN VIVO")) {
      isRunning = true;
  } else if (est.includes("PAUSA")) {
      isRunning = false;
  } else {
      const searchRun = (obj) => {
          if(!obj || typeof obj !== 'object') return null;
          for (const k in obj) {
              const kl = String(k).toLowerCase();
              const val = obj[k];
              if (kl.includes("run") || kl.includes("corriendo") || kl.includes("play") || kl.includes("activo")) {
                  if (val === true || val === 'true' || val === 1 || val === '1') return true;
                  if (val === false || val === 'false' || val === 0 || val === '0') return false;
              }
          }
          return null;
      };

      let rFlag = searchRun(marcador);
      if (rFlag === null) rFlag = searchRun(m);

      if (rFlag !== null) {
          isRunning = rFlag;
      } else {
          isRunning = (est.includes("JUEGO") || est.includes("CURSO") || est.includes("ACTIVO") || est.includes("Q") || est.includes("TIEMPO"));
      }
  }

  return {
    id: m.id ?? `${team1}-${team2}-${m.fecha ?? ""}`,
    type,
    faculty1: detectFaculty(team1),
    faculty2: detectFaculty(team2),
    dateStr: normalizeSpanishDate(m.fecha),
    timeSlot: String(m.hora_inicio || "").replace(/\s+/g, " ").trim(),
    team1, team2,
    score1: getField(marcador, ["puntos_local", "score1", "puntos1"], getField(m, ["score1"], 0)),
    score2: getField(marcador, ["puntos_visitante", "score2", "puntos2"], getField(m, ["score2"], 0)),
    fouls1: getField(marcador, ["faltas_local", "fouls1"], getField(m, ["fouls1"], 0)),
    fouls2: getField(marcador, ["faltas_visitante", "fouls2"], getField(m, ["fouls2"], 0)),
    timeouts1: getField(marcador, ["timeouts_local", "timeouts1", "to1"], getField(m, ["timeouts1", "to1"], 0)),
    timeouts2: getField(marcador, ["timeouts_visitante", "timeouts2", "to2"], getField(m, ["timeouts2", "to2"], 0)),
    time: m.tiempo_actual || getField(marcador, ["clock", "cronometro", "reloj"], getField(m, ["clock", "cronometro", "reloj"], defaultTime)),
    isRunning: isRunning,
    period: getField(m, ["period", "periodo", "set"], "1Q"),
    sets1: getField(marcador, ["sets_local", "set_local", "sets1", "set1"], getField(m, ["sets1", "homeSets"], 0)),
    sets2: getField(marcador, ["sets_visitante", "set_visitante", "sets2", "set2"], getField(m, ["sets2", "awaySets"], 0))
  };
}

async function fetchGames() {
  try {
    const resp = await fetch(apiUrl, { cache: "no-store" });
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    const data = await resp.json();
    let arr = Array.isArray(data) ? data : (data.data || data.matches || data.result || []);

    const filterDate = getLocalISODate(currentDate); // ISO Fecha estricta para evitar desfases
    matchesData = arr.map(normalizeMatch).filter((m) => !filterDate || !m.dateStr || m.dateStr === filterDate);
    renderList();
  } catch (error) {
    console.error("Error conectando a la API:", error);
  }
}

function renderList() {
  const list = document.getElementById("matchList");
  if (!list) return;
  list.innerHTML = "";

  if (matchesData.length === 0) {
    list.innerHTML = `
      <div style="color:#aaa; padding:10px; text-align:center;">No hay partidos para esta fecha.<br><br>
      <button onclick="currentDate = new Date(); updateDateDisplay(); fetchGames();" style="background:var(--accent); border:none; padding:8px; border-radius:6px; font-weight:bold; color:#000;">Ir a Hoy</button></div>`;
    return;
  }

  matchesData.forEach(m => {
    const item = document.createElement("button");
    item.className = "match-item" + (activeMatch && activeMatch.id === m.id ? " active" : "");
    item.innerHTML = `<span class="match-main">${pickTeamDisplay(m.team1, m.faculty1)} vs ${pickTeamDisplay(m.team2, m.faculty2)} (${m.score1} - ${m.score2})</span><span class="match-sub">${m.type.toUpperCase()} | ${m.timeSlot}</span>`;
    item.onclick = () => { activeMatch = m; renderList(); };
    list.appendChild(item);
  });
}

function updateDots(containerId, usedTimeouts) {
    const container = document.getElementById(containerId);
    if (!container) return;
    const dots = container.querySelectorAll('.dot');
    const used = Number(usedTimeouts) || 0;
    
    // Asumiendo un total de 4 tiempos muertos disponibles. Si usó 1, le quedan 3 encendidos.
    const total = 4;
    const remaining = Math.max(0, total - used); 

    dots.forEach((dot, index) => {
        if (index < remaining) {
            dot.classList.remove('off');
        } else {
            dot.classList.add('off');
        }
    });
}

function formatTeamName(name) {
    let n = String(name || "").trim();
    let lower = normalizeText(n);
    if (lower.includes("gastronomia") && lower.includes("turismo")) return "Gastronomía";
    if (lower.includes("ciencias y artes de la comunicacion") || lower === "comunica") return "Comunica";
    if (lower.includes("letras y ciencias humanas") || lower.includes("letras y cc hh") || lower === "letras") return "Humanidades";
    return n;
}

function updateScoreboardDOM() {
  if (!activeMatch) return;
  const m = activeMatch;

  document.getElementById("board-futbol")?.classList.remove("active");
  document.getElementById("board-voley")?.classList.remove("active");
  document.getElementById("board-basket")?.classList.remove("active");

  if (m.type === "futbol" || m.type === "futsal") {
    document.getElementById("board-futbol").classList.add("active");
    const fTeam1 = document.getElementById("f-team1");
    const fTeam2 = document.getElementById("f-team2");
    const fScore1 = document.getElementById("f-score1");
    const fScore2 = document.getElementById("f-score2");

    fTeam1.innerText = pickTeamDisplay(m.team1, m.faculty1);
    fTeam2.innerText = pickTeamDisplay(m.team2, m.faculty2);
    fScore1.innerText = m.score1;
    fScore2.innerText = m.score2;
    document.getElementById("f-league-tag").innerText = m.type === "futsal" ? "FUTSAL INTERFACULTADES 2026" : "FÚTBOL INTERFACULTADES 2026";

    applyTeamTheme(".team-liv", m.faculty1.color);
    applyTeamTheme(".team-bou", m.faculty2.color);
    applyTeamTheme(".score-liv", m.faculty1.color);
    applyTeamTheme(".score-bou", m.faculty2.color);

    fTeam1.style.color = m.faculty1.textColor; fScore1.style.color = m.faculty1.textColor;
    fTeam1.style.textShadow = m.faculty1.textColor === "#000000" ? "none" : "0 1px 3px rgba(0,0,0,0.4)";
    fScore1.style.textShadow = m.faculty1.textColor === "#000000" ? "none" : "0 1px 3px rgba(0,0,0,0.4)";
    fTeam2.style.color = m.faculty2.textColor; fScore2.style.color = m.faculty2.textColor;
    fTeam2.style.textShadow = m.faculty2.textColor === "#000000" ? "none" : "0 1px 3px rgba(0,0,0,0.4)";
    fScore2.style.textShadow = m.faculty2.textColor === "#000000" ? "none" : "0 1px 3px rgba(0,0,0,0.4)";
  }
  else if (m.type === "voley") {
    document.getElementById("board-voley").classList.add("active");
    document.getElementById("v-team1").innerText = formatTeamName(m.team1);
    document.getElementById("v-team2").innerText = formatTeamName(m.team2);
    document.getElementById("v-score1").innerText = m.score1;
    document.getElementById("v-score2").innerText = m.score2;

    let baseSets1 = Number(m.sets1) || 0;
    let baseSets2 = Number(m.sets2) || 0;
    document.getElementById("v-sets").innerText = `SETS: ${baseSets1} - ${baseSets2}`;

    document.querySelector("#board-voley .team-block:nth-child(1) .logo-box").style.backgroundColor = m.faculty1.color;
    document.querySelector("#board-voley .team-block:nth-child(2) .logo-box").style.backgroundColor = m.faculty2.color;
    
    const leftName = document.querySelector("#board-voley .team-block:nth-child(1) .team-name");
    const rightName = document.querySelector("#board-voley .team-block:nth-child(2) .team-name");
    const leftScore = document.querySelector("#board-voley .team-block:nth-child(1) .score");
    const rightScore = document.querySelector("#board-voley .team-block:nth-child(2) .score");

    if(leftName) leftName.style.color = "#373536";
    if(rightName) rightName.style.color = "#373536";
    if(leftScore) leftScore.style.color = "#373536";
    if(rightScore) rightScore.style.color = "#373536";
  }
  else if (m.type === "basket") {
    document.getElementById("board-basket").classList.add("active");
    document.getElementById("b-team1").innerText = formatTeamName(m.team1).toUpperCase();
    document.getElementById("b-team2").innerText = formatTeamName(m.team2).toUpperCase();
    document.getElementById("b-score1").innerText = m.score1;
    document.getElementById("b-score2").innerText = m.score2;
    const inferredBasketPeriod = inferBasketPeriod(m.id, m.time);
    const apiBasketPeriod = String(m.period ?? "").trim();
    document.getElementById("b-period").innerText = (apiBasketPeriod && apiBasketPeriod !== "1Q") ? apiBasketPeriod : inferredBasketPeriod;
    document.getElementById("b-fouls1").innerText = `FALTAS: ${m.fouls1}`;
    document.getElementById("b-fouls2").innerText = `FALTAS: ${m.fouls2}`;

    document.getElementById("b-bonus1")?.classList.toggle("active", Number(m.fouls1) >= 5);
    document.getElementById("b-bonus2")?.classList.toggle("active", Number(m.fouls2) >= 5);
    
    updateDots("b-to1", m.timeouts1);
    updateDots("b-to2", m.timeouts2);

    document.querySelector("#board-basket .panel-izquierdo").style.backgroundColor = m.faculty1.color;
    document.querySelector("#board-basket .panel-derecho").style.backgroundColor = m.faculty2.color;

    const bTeam1 = document.getElementById("b-team1"), bScore1 = document.getElementById("b-score1"), bFouls1 = document.getElementById("b-fouls1");
    if(bTeam1) { bTeam1.style.color = m.faculty1.textColor; bTeam1.style.textShadow = m.faculty1.textColor === "#000000" ? "none" : "0 1px 3px rgba(0,0,0,0.6)"; }
    if(bScore1) { bScore1.style.color = m.faculty1.textColor; bScore1.style.textShadow = m.faculty1.textColor === "#000000" ? "none" : "0 1px 3px rgba(0,0,0,0.6)"; }
    if(bFouls1) { bFouls1.style.color = m.faculty1.textColor; bFouls1.style.textShadow = m.faculty1.textColor === "#000000" ? "none" : "0 1px 2px rgba(0,0,0,0.8)"; }

    const bTeam2 = document.getElementById("b-team2"), bScore2 = document.getElementById("b-score2"), bFouls2 = document.getElementById("b-fouls2");
    if(bTeam2) { bTeam2.style.color = m.faculty2.textColor; bTeam2.style.textShadow = m.faculty2.textColor === "#000000" ? "none" : "0 1px 3px rgba(0,0,0,0.6)"; }
    if(bScore2) { bScore2.style.color = m.faculty2.textColor; bScore2.style.textShadow = m.faculty2.textColor === "#000000" ? "none" : "0 1px 3px rgba(0,0,0,0.6)"; }
    if(bFouls2) { bFouls2.style.color = m.faculty2.textColor; bFouls2.style.textShadow = m.faculty2.textColor === "#000000" ? "none" : "0 1px 2px rgba(0,0,0,0.8)"; }
  }

  const newSeconds = parseTime(m.time);

  if (!m.isRunning) {
      localSeconds = newSeconds;
      lastApiTimeRaw = m.time;
  } else {
      if (!localIsRunning || localSeconds === 0) {
          localSeconds = newSeconds;
          lastApiTimeRaw = m.time;
      } else {
          if (m.time !== lastApiTimeRaw) {
              if (Math.abs(newSeconds - localSeconds) > 3) {
                  localSeconds = newSeconds;
              }
              lastApiTimeRaw = m.time;
          }
      }
  }

  localIsRunning = m.isRunning;
  updateClocks();
}

function toggleStudio(show) {
  const studioShell = document.getElementById("studioShell");
  const obsMenuBtn = document.getElementById("obsMenuBtn");
  if (show) {
    studioShell?.classList.remove("hidden");
    obsMenuBtn?.classList.add("hidden");
    if (refreshInterval) clearInterval(refreshInterval);
  } else {
    studioShell?.classList.add("hidden");
    obsMenuBtn?.classList.remove("hidden");
    refreshInterval = setInterval(async () => {
      if (!activeMatch) return;
      await fetchGames();
      const updatedMatch = matchesData.find(x => x.id === activeMatch.id);
      if (updatedMatch) {
        activeMatch = updatedMatch;
        updateScoreboardDOM();
      }
    }, 5000);
  }
}

document.getElementById("loadGamesBtn")?.addEventListener("click", fetchGames);
document.getElementById("obsMenuBtn")?.addEventListener("click", () => toggleStudio(true));
document.getElementById("closePickerBtn")?.addEventListener("click", () => toggleStudio(false));
document.getElementById("useGameBtn")?.addEventListener("click", () => {
  if (activeMatch) { updateScoreboardDOM(); toggleStudio(false); } 
  else { alert("Selecciona un partido primero de la lista."); }
});

fetchGames();
  </script>
