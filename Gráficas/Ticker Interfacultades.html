<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DSC Bottomline</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#1056C0;--dark:#0C0E14;--sep:#1B2030;
  --text:#FFF;--dim:#556688;--gold:#E8B020;--red:#CC2020;
  --fs-tab:1.7vw;--fs-team:2.4vw;--fs-score:2.8vw;
  --fs-badge:1.4vw;--fs-date:2.2vw;--fs-label:1.5vw;
  --gallery-w:11.2vw;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:transparent}
body{font-family:"Barlow Condensed","Arial Narrow",sans-serif}
#bl{position:relative;width:100%;height:100%;display:flex;align-items:stretch;
  background:#0C0E14;border-top:0.46vh solid var(--blue);overflow:hidden}
#pMain{flex:1;min-width:0;position:relative;overflow:hidden}
#phCats{position:absolute;inset:0;display:flex;align-items:stretch;
  transition:opacity .28s,transform .28s}
#phCats.hide{opacity:0;transform:translateY(-110%);pointer-events:none}
.ctab{display:flex;align-items:center;justify-content:center;
  font-size:var(--fs-tab);font-weight:800;letter-spacing:0.1vw;
  text-transform:uppercase;color:var(--dim);
  border-right:1px solid var(--sep);white-space:nowrap;padding:0 1.1vw;height:100%}
.ctab:first-child{border-left:1px solid var(--sep)}
.ctab.hl{background:var(--blue);color:#fff;animation:pulse .65s ease infinite alternate}
@keyframes pulse{from{background:#1056C0}to{background:#1A72FF}}
#phContent{position:absolute;inset:0;display:flex;align-items:stretch;
  opacity:0;transform:translateY(110%);
  transition:opacity .28s,transform .28s;pointer-events:none}
#phContent.show{opacity:1;transform:translateY(0);pointer-events:auto}
#cLabel{flex-shrink:0;background:var(--blue);padding:0 1.1vw;
  display:flex;align-items:center;font-size:var(--fs-label);font-weight:900;
  letter-spacing:0.15vw;text-transform:uppercase;color:#fff;white-space:nowrap;
  border-right:2px solid rgba(255,255,255,.15)}
#cSingle{flex:1;min-width:0;display:flex;align-items:center;
  padding:0 1.2vw;gap:0.6vw;overflow:hidden;justify-content:center;}
#cSingle.gone{display:none}
#cScroll{flex:1;min-width:0;overflow:hidden;display:flex;align-items:center}
#cScroll.gone{display:none}
#scrollInner{display:inline-flex;align-items:center;white-space:nowrap}
.tlogo{height:80vh;width:auto;max-width:6vw;object-fit:contain;flex-shrink:0;
  filter:drop-shadow(0 0.5vh 1vh rgba(0,0,0,.6)); margin: 0 0.5vw;}
.tlogo-sm{height:50vh;width:auto;max-width:3.2vw;object-fit:contain;flex-shrink:0;
  filter:drop-shadow(0 0.3vh 0.6vh rgba(0,0,0,.5))}
.stn{font-size:var(--fs-team);font-weight:800;color:#fff;
  max-width:18vw;overflow:hidden;white-space:nowrap;
  display:inline-block;vertical-align:middle}
.stn.scroll{animation:marquee 5s linear infinite;animation-delay:0.5s}
@keyframes marquee{0%,15%{transform:translateX(0)}80%,100%{transform:translateX(calc(-100% + 18vw))}}
.ssc{font-size:var(--fs-score);font-weight:900;color:var(--gold);min-width:1.5vw;text-align:center}
.sdash{color:var(--dim);font-size:calc(var(--fs-score)*0.75);margin:0 0.2vw}
.sfin{font-size:calc(var(--fs-score)*0.85);font-weight:900;
  color:var(--gold);letter-spacing:0.06vw;flex-shrink:0; margin-left: 1vw;}
.slive{font-size:var(--fs-team);font-weight:900;letter-spacing:0.06vw;
  text-transform:uppercase;padding:0.15vh 0.5vw;border-radius:1px;
  flex-shrink:0;background:rgba(204,32,32,.2);color:var(--red); margin-left: 1vw;}
.sclock{font-size:var(--fs-team);font-weight:900;color:var(--red);
  margin-left:0.5vw;flex-shrink:0}
.sdt{font-size:var(--fs-date);font-weight:900;color:var(--gold);
  letter-spacing:0.04vw;flex-shrink:0;white-space:nowrap; margin-left: 1vw;}
.sbases{display:inline-flex;align-items:center;gap:0.2vw;
  margin-left:0.4vw;flex-shrink:0}
.souts{font-size:var(--fs-badge);font-weight:900;color:var(--dim);
  margin-left:0.4vw;flex-shrink:0;letter-spacing:0.05vw}
.sbase{width:1.6vw;height:1.6vw;transform:rotate(45deg);
  border:0.15vw solid var(--dim);flex-shrink:0}
.sbase.on{background:var(--gold);border-color:var(--gold)}
.sbases{gap:0.35vw !important}
.ssep{display:inline-block;margin:0 1.1vw;color:#1056C0;font-size:1.8vw;font-weight:900}
.sit{display:inline-flex;align-items:center;gap:0.5vw}

/* GALLERY LOGOS REPLACING DSC */
#pGallery{flex-shrink:0;width:var(--gallery-w);position:relative;
  overflow:hidden;border-left:2px solid #1056C0;
  background:linear-gradient(135deg,#0A255A,#050D20);}
.g-logo{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity 1s ease-in-out;padding:0.4vw;}
.g-logo.active{opacity:1;}

#sAlert{position:absolute;inset:0;z-index:100;background:#0038DD;
  display:flex;align-items:center;justify-content:center;gap:1vw;flex-wrap:nowrap;
  transform:translateY(110%);transition:transform .4s cubic-bezier(.4,0,.2,1);
  border-top:0.46vh solid #FFD700;pointer-events:none;overflow:hidden;padding:0 1vw}
#sAlert.on{transform:translateY(0)}
.ab{font-size:1.05vw;font-weight:900;letter-spacing:0.18vw;text-transform:uppercase;
  padding:0.3vh 0.9vw;border-radius:1px;animation:aflash .55s ease infinite alternate;
  flex-shrink:0;white-space:nowrap}
@keyframes aflash{from{background:#fff;color:#0038DD}to{background:#FFD700;color:#001566}}
.at{font-size:1.4vw;font-weight:900;color:#fff;display:inline-flex;align-items:center;gap:0.4vw;white-space:nowrap;max-width:28vw;overflow:hidden;flex-shrink:1;min-width:0}
.as{font-size:2.1vw;font-weight:900;color:#FFD700;padding:0 0.6vw;letter-spacing:0.2vw;flex-shrink:0;white-space:nowrap;min-width:7vw;text-align:center}
.ac{font-size:0.95vw;font-weight:700;color:rgba(255,255,255,.5);
  letter-spacing:0.12vw;text-transform:uppercase;
  border-left:1px solid rgba(255,255,255,.2);padding-left:0.9vw;flex-shrink:0;white-space:nowrap}
.ainfo{font-size:1.05vw;font-weight:800;color:#FFD700;letter-spacing:0.1vw;text-transform:uppercase;flex-shrink:0;white-space:nowrap}

/* ── INTERFACULTADES BRANDING SCREEN ───────────────────────────── */
#dupoScreen{
  position:absolute;
  top:0;left:0;right:var(--gallery-w);bottom:0;
  background:#0C0E14;
  display:flex;align-items:center;justify-content:center;
  gap:1.5vw;
  opacity:0;transform:translateY(110%);
  transition:opacity .35s,transform .35s;
  pointer-events:none;z-index:50;
  border-top:0;
}
#dupoScreen.show{opacity:1;transform:translateY(0)}
.dupoLine1{
  font-size:2.1vw;font-weight:700;color:rgba(255,255,255,.45);
  letter-spacing:0.25vw;text-transform:uppercase;white-space:nowrap
}
.dupoLine2{
  font-size:4.8vw;font-weight:900;color:#fff;
  letter-spacing:0.15vw;text-transform:uppercase;white-space:nowrap;
  text-shadow:0 0 3vw rgba(16,86,192,.9)
}
</style>
</head>

function cleanTeamName(n) {
  if (!n) return "?";
  var name = n.trim();
  var lower = name.toLowerCase();
  
  if (lower.indexOf("ciencias y artes de la comunicación") >= 0) return "Comunica";
  if (lower.indexOf("gastronomía, hotelería y turismo") >= 0) return "GHOT";
  if (lower.indexOf("ciencias e ingeniería") >= 0) return "FACI";
  if (lower.indexOf("arquitectura y urbanismo") >= 0) return "Arquitectura";
  if (lower.indexOf("letras y ciencias humanas") >= 0) return "LLCCHH";
  if (lower.indexOf("artes escénicas") >= 0 || lower.indexOf("artes escenicas") >= 0) return "FARES";
  if (lower.indexOf("gestión y alta dirección") >= 0 || lower.indexOf("gestion y alta direccion") >= 0) return "Gestión";
  if (lower.indexOf("ciencias contables") >= 0) return "Contabilidad";
  
  return name;
}

function mkImg(url,sz){
  if(!url) return "";
  var img=document.createElement("img");
  img.className=sz||"tlogo";
  img.src=url.replace("http://","https://");
  img.alt="";
  img.onerror=function(){this.style.visibility="hidden";this.style.width="0";};
  return img.outerHTML;
}

function short(n,m){
  m=m||25; if(!n) return "?"; if(n.length<=m) return n;
  return n.slice(0,m-2)+"...";
}

function normScoreValue(v){
  if(v === 0) return "0";
  if(v === null || v === undefined) return "";
  var s = String(v).trim();
  if(s === "") return "";
  return s;
}

function pickScoreValue(primary, fallback){
  var p = normScoreValue(primary);
  if(p !== "") return p;
  return normScoreValue(fallback);
}

function normalizeMatchState(raw){
  var s = String(raw || "").toUpperCase().trim();
  if(!s) return "";
  if(s.indexOf("EN VIVO") >= 0 || s.indexOf("VIVO") >= 0 || s.indexOf("PAUS") >= 0 || s.indexOf("EN CURSO") >= 0 || s.indexOf("JUG") >= 0) return "LIVE";
  if(s.indexOf("FINAL") >= 0 || s.indexOf("TERMIN") >= 0 || s.indexOf("CONCL") >= 0) return "FIN";
  return s;
}


function getMatchScore(ev, key){
  if(!ev) return "";
  if(ev[key] !== undefined && ev[key] !== null && ev[key] !== "") return ev[key];
  if(ev.marcador && ev.marcador[key] !== undefined && ev.marcador[key] !== null && ev.marcador[key] !== "") return ev.marcador[key];
  if(ev.score && ev.score[key] !== undefined && ev.score[key] !== null && ev.score[key] !== "") return ev.score[key];
  return "";
}

// ── UI HTML GENERATORS ────────────────────────────────────────────
function mkBadge(ev){
  var clk = ev.clock || "";
  var isBaseball=ev._sport&&ev._sport.indexOf("baseball")>=0;
  if(ev.live){
    if(isBaseball) return "<span class=\"slive\">" + (ev.period || "EN VIVO") + "</span>";
    return "<span class=\"slive\">" + (ev.estadoOriginal === "PAUSADO" ? "PAUSADO" : "EN VIVO") + "</span>" + (clk?"<span class=\"sclock\">"+clk+"</span>":"");
  }
  if(ev.status==="FIN") return "<span class=\"sfin\">FINAL</span>";
  
  return "<span class=\"sdt\">"+(ev.hora_inicio || "")+"</span>";
}
function mkScores(ev){
  if(ev.status==="upcoming") return "<span class=\"sdt\" style=\"padding:0 0.4vw; margin-left:0;\">VS</span>";
  
  return "<span class=\"ssc\">"+ev.homeScore+"</span>"
         +"<span class=\"sdash\">-</span>"
         +"<span class=\"ssc\">"+ev.awayScore+"</span>";
}
function scoreH(ev){
  // REMOVED CATEGORY SPAN (".slg") FROM HERE AS REQUESTED
  return mkImg(ev.homeLogo,"tlogo")
         +"<span class=\"stn\">"+ev.home+"</span>"
         +mkScores(ev)
         +"<span class=\"stn\">"+ev.away+"</span>"
         +mkImg(ev.awayLogo,"tlogo")
         +mkBadge(ev);
}

// ── RENDER TABS ───────────────────────────────────────────────────
function renderTabs(){
  var html=catQueue.map(function(id){
    var n=ALL_CATS[id]||id.toUpperCase();
    var isLive=(S.data[id]||[]).some(function(e){return e.live;});
    return "<div class=\"ctab "+(isLive?"hl":"")+"\" id=\"tab_"+id+"\">"+n+"</div>";
  }).join("");
  document.getElementById("phCats").innerHTML=html;
}

// ── SUPABASE FETCH AND PARSE ──────────────────────────────────────
async function loadSupabaseAPI() {
  try {
    var res = await fetch("https://jlynumhismotkwggjfug.supabase.co/functions/v1/scoreboard?token=dupocorp_2026&_t=" + new Date().getTime(), { cache: "no-store" });
    if(!res.ok) return;
    var data = await res.json();
    
    var newData = {};
    ALL_CATS = {}; 
    
    var days = ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];
    var months = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
    
    var now = new Date();
    var todayStr = (days[now.getDay()] + " " + now.getDate() + " De " + months[now.getMonth()]).toLowerCase().replace(/\s+/g, " ");
    
    var yesterday = new Date();
    yesterday.setDate(yesterday.getDate() - 1);
    var yesterdayStr = (days[yesterday.getDay()] + " " + yesterday.getDate() + " De " + months[yesterday.getMonth()]).toLowerCase().replace(/\s+/g, " ");
    
    data.forEach(function(ev) {
      var fechaPartido = (ev.fecha || "").toLowerCase().trim().replace(/\s+/g, " ");
      if (fechaPartido !== todayStr && fechaPartido !== yesterdayStr) {
        return; 
      }
      
      var deporte = ev.deporte || "Deporte"; 
      var generoRaw = ev.genero || ""; 
      var generoStr = "";
      
      if (generoRaw.toLowerCase() === "hombres") {
          generoStr = "MASCULINO";
      } else if (generoRaw.toLowerCase() === "mujeres") {
          generoStr = "FEMENINO";
      } else {
          generoStr = generoRaw.toUpperCase();
      }
      
      var catName = generoStr ? (deporte + " " + generoStr).toUpperCase() : deporte.toUpperCase();
      var catId = catName.toLowerCase().replace(/\s+/g, "_");
      
      ALL_CATS[catId] = catName;
      if(!newData[catId]) newData[catId] = [];
      
      var estadoOriginal = (ev.estado || "").toUpperCase();
      var isLive = estadoOriginal === "EN VIVO" || estadoOriginal === "PAUSADO" || estadoOriginal === "LIVE"; 
      var isDone = estadoOriginal === "FINALIZADO" || estadoOriginal === "FINAL" || estadoOriginal === "TERMINADO";
      var statusStr = isLive ? "EN VIVO" : (isDone ? "FIN" : "upcoming");
      
      newData[catId].push({
        id: ev.id || Math.random().toString(),
        home: short(cleanTeamName(ev.equipo_local), 30), 
        away: short(cleanTeamName(ev.equipo_visitante), 30),
        homeLogo: ev.logo_local || "",
        awayLogo: ev.logo_visitante || "",
        
        homeScore: (isLive || isDone) ? String(getMatchScore(ev, "puntos_local")) : "",
        awayScore: (isLive || isDone) ? String(getMatchScore(ev, "puntos_visitante")) : "",
        
        rawDate: ev.fecha || "",
        hora_inicio: ev.hora_inicio || "", 
        status: statusStr,
        estadoOriginal: estadoOriginal,
        live: isLive,
        league: ev.fase || catName,
        cat: catId,
        clock: ev.tiempo_actual || "",  
        period: ev.periodo || 0,
        _sport: deporte.toLowerCase()
      });
    });
    
    _applyData(newData);
    syncQueue();
    console.log("[SUPABASE] Partidos del día cargados.");
  } catch(e) {
    console.warn("[SUPABASE] error al cargar", e);
  }
}

function _applyData(newData){
  checkAlerts(newData);
  Object.keys(newData).forEach(function(cat){
    newData[cat].sort(function(a,b){
      function rank(ev){return ev.live?0:(ev.status==="FIN"?1:2);}
      return rank(a)-rank(b);
    });
    S.data[cat]=newData[cat];
  });
}

function checkAlerts(newData){
  var alerted={};
  Object.values(newData).flat().forEach(function(ev){
    var k=ev.id;
    var str=ev.homeScore+"-"+ev.awayScore;
    var prev=S.prevScores[k]||"";
    var wasFin=S.prevStatus[k]==="FIN";
    var prevWasLive=!!S.prevWasLive[k];
    var prevStatus=S.prevStatus[k]||"";
    
    if(shouldAlert(ev, prev, str, wasFin, prevWasLive, prevStatus)){
      if(!alerted[k]){
        alerted[k]=1; 
        ev._prevScore=prev;
        queueAlert(ev);
      }
    }
    S.prevScores[k]=str;
    S.prevStatus[k]=ev.status;
    if(ev.live) S.prevWasLive[k]=true;
  });
}

function shouldAlert(ev, oldStr, newStr, wasFin, prevWasLive, prevStatus){
  if(!prevWasLive) return false;
  if(wasFin) return false; 
  if(ev.status==="FIN" && prevStatus==="EN VIVO") return true;
  if(!ev.live) return false;
  if(oldStr===newStr) return false;
  return true;
}

function queueAlert(ev){
  S.alertQ.push(ev);
}

function syncQueue(){
  var catKeys = Object.keys(ALL_CATS);
  catQueue=catQueue.filter(function(id){return (S.data[id]||[]).length>0;});
  catKeys.forEach(function(id){
    if((S.data[id]||[]).length>0 && catQueue.indexOf(id)<0) catQueue.push(id);
  });
}

// ── STATE MACHINE & CAROUSEL ──────────────────────────────────────
function gotoNextCat(){
  clearTimeout(S.timer);
  syncQueue();
  if(!catQueue.length){S.timer=setTimeout(gotoNextCat,2000);return;}
  renderTabs();
  document.getElementById("phContent").classList.remove("show");
  document.getElementById("phCats").classList.remove("hide");
  S.itemIdx=0;
  var cat=catQueue[0];
  S.timer=setTimeout(function(){enterCat(cat);},CAT_PAUSE_SEC*1000);
}

function enterCat(catId){
  document.getElementById("phCats").classList.add("hide");
  document.getElementById("phContent").classList.add("show");
  document.getElementById("cSingle").classList.remove("gone");
  document.getElementById("cScroll").classList.add("gone");
  document.getElementById("cLabel").textContent=ALL_CATS[catId]||catId.toUpperCase();
  showNextItem(catId);
}

function showNextItem(catId){
  clearTimeout(S.timer);
  var items=S.data[catId]||[];
  if(!items.length || S.itemIdx>=items.length){advanceCat();return;}
  
  document.getElementById("cSingle").innerHTML=scoreH(items[S.itemIdx]);
  S.itemIdx++;
  requestAnimationFrame(function(){
    document.querySelectorAll("#cSingle .stn").forEach(function(el){
      el.classList.toggle("scroll",el.scrollWidth>el.offsetWidth+2);
    });
  });
  S.timer=setTimeout(function(){showNextItem(catId);},ITEM_SEC*1000);
}

function advanceCat(){
  if(S.alertQ.length>0 && !S.alertBusy){
    runAlert(doAdvanceCat);
  } else {
    doAdvanceCat();
  }
}

function runAlert(cb){
  if(!S.alertQ.length){S.alertBusy=false;return;}
  S.alertBusy=true;
  var ev=S.alertQ.shift();
  var isFin=ev.status==="FIN";
  var GOLD="color:#FFD700;font-weight:900";
  var WHITE="color:#fff";
  var homeGold=false, awayGold=false, homeScoreGold=false, awayScoreGold=false;
  
  if(isFin){
    var hN=parseFloat(ev.homeScore)||0, aN=parseFloat(ev.awayScore)||0;
    if(hN>aN){homeGold=true;homeScoreGold=true;}
    else if(aN>hN){awayGold=true;awayScoreGold=true;}
  } else if(ev._prevScore){
    var parts=ev._prevScore.split("-");
    var dH=(+(ev.homeScore)||0)-(+parts[0]||0);
    var dA=(+(ev.awayScore)||0)-(+parts[1]||0);
    if(dH>0&&dA>0){homeGold=true;awayGold=true;homeScoreGold=true;awayScoreGold=true;}
    else if(dH>0){homeGold=true;homeScoreGold=true;}
    else if(dA>0){awayGold=true;awayScoreGold=true;}
  }
  
  var scoreHTML="<span style='"+(homeScoreGold?GOLD:WHITE)+"'>"+ev.homeScore+"</span>"
    +"<span style='color:rgba(255,255,255,.4);margin:0 0.4vw'>:</span>"
    +"<span style='"+(awayScoreGold?GOLD:WHITE)+"'>"+ev.awayScore+"</span>";
    
  document.getElementById("alertBadge").innerHTML=isFin?"&#9971; FINAL":"&#9889; ALERTA DE RESULTADO";
  document.getElementById("aH").innerHTML="<span style='"+(homeGold?GOLD:WHITE)+"'>"+mkImg(ev.homeLogo,"tlogo")+ev.home+"</span>";
  document.getElementById("aS").innerHTML=scoreHTML;
  document.getElementById("aA").innerHTML="<span style='"+(awayGold?GOLD:WHITE)+"'>"+ev.away+mkImg(ev.awayLogo,"tlogo")+"</span>";
  document.getElementById("aC").textContent=ev.league;
  document.getElementById("aInfo").textContent=isFin?"FINAL":"EN VIVO";
  
  var el=document.getElementById("sAlert");
  el.classList.add("on");
  setTimeout(function(){
    el.classList.remove("on");
    setTimeout(cb, 300);
  }, ALERT_SEC*1000);
}

function doAdvanceCat(){
  if(!catQueue.length){ gotoNextCat(); return; }
  var justFinished=catQueue[0];
  if(catQueue.length>1){
    catQueue.shift();
    catQueue.push(justFinished);
  }
  
  var liveCats=catQueue.filter(function(id){return (S.data[id]||[]).some(function(ev){return ev.live;});});
  if(!S.livePhaseDone && liveCats.length>0){
    if((S.data[justFinished]||[]).some(function(e){return e.live;})) S.roundShown.add(justFinished);
    if(liveCats.every(function(id){return S.roundShown.has(id);})){
      S.roundShown=new Set();
      var noLiveQ=catQueue.filter(function(id){return (S.data[id]||[]).length>0 && !(S.data[id]||[]).some(function(e){return e.live;});});
      if(noLiveQ.length>0){
        S.livePhaseDone=true;
        var liveQ=catQueue.filter(function(id){return (S.data[id]||[]).some(function(e){return e.live;});});
        catQueue=liveQ.concat(noLiveQ); 
      }
    }
  } else if(S.livePhaseDone) {
    if(!(S.data[justFinished]||[]).some(function(e){return e.live;})) S.roundShown.add(justFinished);
    var noLiveQ=catQueue.filter(function(id){return (S.data[id]||[]).length>0 && !(S.data[id]||[]).some(function(e){return e.live;});});
    if(noLiveQ.every(function(id){return S.roundShown.has(id);})){
      S.roundShown=new Set();
      S.livePhaseDone=false;
      showDupo();
      return;
    }
  }
  
  if(S.alertQ.length>0 && !S.alertBusy){
    runAlert(gotoNextCat);
  }else{
    gotoNextCat();
  }
}

function showDupo(){
  var screen=document.getElementById("dupoScreen");
  document.getElementById("phContent").classList.remove("show");
  document.getElementById("phCats").classList.add("hide");
  screen.classList.add("show");
  setTimeout(function(){
    screen.classList.remove("show");
    setTimeout(function(){
      var liveCats=catQueue.filter(function(id){return (S.data[id]||[]).some(function(e){return e.live;});});
      var noLiveQ=catQueue.filter(function(id){return (S.data[id]||[]).length>0 && !(S.data[id]||[]).some(function(e){return e.live;});});
      catQueue=liveCats.concat(noLiveQ);
      gotoNextCat();
    }, 500);
  }, 5000);
}

function startGallery() {
  var logos = document.querySelectorAll('.g-logo');
  if (!logos.length) return;
  var curLogo = 0;
  setInterval(function() {
    logos[curLogo].classList.remove('active');
    curLogo = (curLogo + 1) % logos.length;
    logos[curLogo].classList.add('active');
  }, 5000);
}

async function init(){
  await loadSupabaseAPI();
  setInterval(loadSupabaseAPI, 30000);
  startGallery();
  gotoNextCat();
}

window.onload=init;

</script>
